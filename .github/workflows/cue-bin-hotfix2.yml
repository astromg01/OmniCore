name: CUE BIN Hotfix Runner

on:
  push:
    paths:
      - ".github/workflows/cue-bin-hotfix2.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Clone repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags origin main
          git checkout -B main origin/main

      - name: Apply source patch and push
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_cue_bin_hotfix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/omnicore/emulator/emulation/EmulationActivity.kt
          git add app/src/main/java/com/omnicore/emulator/storage/SafGameSource.kt
          git add app/build.gradle.kts
          git commit -m "Fix PS1 CUE BIN local staging"
          git push origin HEAD:main
