name: Runtime v6 Migration

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/runtime-v6-migrate.yml"
      - "tools/apply_runtime_v6.py"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Clone repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags origin main
          git checkout -B main origin/main

      - name: Apply Runtime v6 rewrite
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/apply_runtime_v6.py')
          s = p.read_text()
          old = 'v6 = replace_once(v6, "            presentedFrames_.store(0, std::memory_order_relaxed);\\n", "", "remove duplicate presented reset")'
          new = 'v6 = v6.replace("            presentedFrames_.store(0, std::memory_order_relaxed);\\n", "", 1)'
          if old not in s:
              raise SystemExit('migration guard line not found')
          p.write_text(s.replace(old, new, 1))
          PY
          python3 tools/apply_runtime_v6.py
          test -f app/src/main/cpp/libretro_host_v6.cpp
          grep -q 'libretro_host_v6.cpp' app/src/main/cpp/CMakeLists.txt
          grep -q 'versionName = "0.5.0"' app/build.gradle.kts

      - name: Commit runtime rewrite
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts \
                  app/src/main/cpp/CMakeLists.txt \
                  app/src/main/cpp/libretro_host_v6.cpp \
                  app/src/main/cpp/native_bridge.cpp \
                  app/src/main/java/com/omnicore/emulator/settings/Ps1Settings.kt
          git commit -m "Rewrite PS1 runtime with decoupled A/V pipeline"
          git push origin HEAD:main
