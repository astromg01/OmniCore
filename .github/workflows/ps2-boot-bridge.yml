name: PS2 Alpha 2 Release

on:
  push:
    branches: [ "agent/0.11.0-ps2-foundation" ]
    paths:
      - ".ci/ps2-boot-bridge-trigger.txt"

permissions:
  contents: write
  statuses: write

concurrency:
  group: ps2-alpha2-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PS2 branch
        uses: actions/checkout@v4
        with:
          ref: agent/0.11.0-ps2-foundation
          fetch-depth: 0

      - name: Publish pending CI status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state='pending' \
            -f context='omnicore/ps2-alpha2' \
            -f description='PS2 Alpha 2 validation running' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Protect PS1 and N64 runtimes
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin agent/0.10.0-n64-foundation
          changed="$(git diff --name-only origin/agent/0.10.0-n64-foundation...HEAD)"
          forbidden='^(app/src/main/cpp/(native_bridge\.cpp|gl_presenter\.cpp|libretro_host_v7\.cpp|n64/)|app/src/main/java/com/omnicore/emulator/core/n64/|app/src/main/java/com/omnicore/emulator/emulation/N64|app/src/main/java/com/omnicore/emulator/performance/N64)'
          if echo "$changed" | grep -E "$forbidden"; then
            echo "PS2 Alpha 2 modified protected PS1/N64 runtime source." >&2
            exit 1
          fi
          git diff --check origin/agent/0.10.0-n64-foundation...HEAD

      - name: Verify PS2 Alpha 2 source contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'versionCode = 41' app/build.gradle.kts
          grep -Fq 'versionName = "0.11.1"' app/build.gradle.kts
          test -f app/src/main/java/com/omnicore/emulator/emulation/PS2GamepadOverlayView.kt
          test -f app/src/main/java/com/omnicore/emulator/emulation/PS2ClassicBootView.kt
          test -f app/src/main/java/com/omnicore/emulator/settings/PS2Settings.kt
          test -f app/src/main/java/com/omnicore/emulator/settings/PS2InputSettings.kt
          test -f app/src/main/java/com/omnicore/emulator/ui/ps2/PS2SettingsDialog.kt
          test -f app/src/main/java/com/virtualapplications/play/InputManager.java
          test -f app/src/main/java/com/virtualapplications/play/InputManagerConstants.java
          test -f app/src/main/java/com/virtualapplications/play/SettingsManager.java
          grep -Fq 'android:process=":ps2"' app/src/main/AndroidManifest.xml
          grep -Fq 'PS2GamepadOverlayView' app/src/main/java/com/omnicore/emulator/emulation/PS2EmulationActivity.kt
          grep -Fq 'PS2ClassicBootView' app/src/main/java/com/omnicore/emulator/emulation/PS2EmulationActivity.kt
          grep -Fq 'dispatchKeyEvent' app/src/main/java/com/omnicore/emulator/emulation/PS2EmulationActivity.kt
          grep -Fq 'onGenericMotionEvent' app/src/main/java/com/omnicore/emulator/emulation/PS2EmulationActivity.kt
          grep -Fq 'saveState' app/src/main/java/com/omnicore/emulator/emulation/PS2EmulationActivity.kt
          grep -Fq 'qualityFloorScale >= 1.0f' app/src/main/java/com/omnicore/emulator/core/ps2/PS2Backend.kt
          grep -Fq 'allowCycleSkipping = false' app/src/main/java/com/omnicore/emulator/performance/PS2SmartPerf.kt
          grep -Fq 'internalResolutionFactor = requested.internalResolution.factor' app/src/main/java/com/omnicore/emulator/performance/PS2SmartPerf.kt
          grep -Fq 'BootStyle.CLASSIC' app/src/main/java/com/omnicore/emulator/settings/PS2Settings.kt
          grep -Fq 'Configurar PlayStation 2' app/src/main/java/com/omnicore/emulator/ui/OmniCoreV4App.kt
          echo "OMNICORE_PS2_ALPHA2_SOURCE_OK controls settings smartperf classic-boot"

      - name: Verify Android toolchains
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          OMNI_NDK="$ANDROID_SDK_ROOT/ndk/28.2.13676358"
          PLAY_NDK="$ANDROID_SDK_ROOT/ndk/29.0.14206865"
          test -d "$OMNI_NDK"
          if ! test -d "$PLAY_NDK"; then
            yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865"
          fi
          test -d "$PLAY_NDK"
          echo "OMNI_NDK_HOME=$OMNI_NDK" >> "$GITHUB_ENV"
          echo "PLAY_NDK_HOME=$PLAY_NDK" >> "$GITHUB_ENV"
          test -x "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          test -x "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign"

      - name: Prepare stable DEV signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/signing
          base64 -d config/omnicore-dev.keystore.b64 > build/signing/omnicore-dev.jks
          chmod 600 build/signing/omnicore-dev.jks
          echo "OMNICORE_DEV_KEYSTORE=$GITHUB_WORKSPACE/build/signing/omnicore-dev.jks" >> "$GITHUB_ENV"
          echo "OMNICORE_DEV_STORE_PASSWORD=omnicore-dev-2026" >> "$GITHUB_ENV"
          echo "OMNICORE_DEV_KEY_ALIAS=omnicore-dev" >> "$GITHUB_ENV"
          echo "OMNICORE_DEV_KEY_PASSWORD=omnicore-dev-2026" >> "$GITHUB_ENV"

      - name: Fetch and build protected PS1 and N64 cores
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$OMNI_NDK_HOME"
          chmod +x tools/fetch_ps1_core.sh tools/build_ps1_core_android.sh tools/fetch_n64_core.sh tools/build_n64_core_android.sh
          tools/fetch_ps1_core.sh
          tools/build_ps1_core_android.sh
          tools/fetch_n64_core.sh
          tools/build_n64_core_android.sh
          test "$(git -C third_party/pcsx_rearmed rev-parse HEAD)" = "da2cb8ecd17fd0932ab6d94774c0522beebce6e3"
          test "$(git -C third_party/mupen64plus_next rev-parse HEAD)" = "f275caf4b2bfa1e6d1c51636746ea793f3d80320"
          for ABI in arm64-v8a armeabi-v7a; do
            test -s "app/src/main/jniLibs/$ABI/libpcsx_rearmed_libretro.so"
            test -s "app/src/main/jniLibs/$ABI/libmupen64plus_next_libretro.so"
          done

      - name: Fetch pinned Play backend
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/fetch_ps2_play_backend.sh tools/build_ps2_play_backend_android.sh
          tools/fetch_ps2_play_backend.sh
          test "$(git -C build/third_party/play rev-parse HEAD)" = "04bde0df87ee7c0e2f0151b51bb2cc22c88541da"

      - name: Build pinned Play dual ABI
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$PLAY_NDK_HOME"
          export PLAY_ABIS="arm64-v8a armeabi-v7a"
          export PLAY_BUILD_JOBS="2"
          tools/build_ps2_play_backend_android.sh
          for ABI in arm64-v8a armeabi-v7a; do
            test -s "app/src/main/jniLibs/$ABI/libPlay.so"
          done

      - name: Verify Play gameplay JNI surface
        shell: bash
        run: |
          set -euo pipefail
          READELF="$PLAY_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          symbols=(
            Java_com_virtualapplications_play_NativeInterop_createVirtualMachine
            Java_com_virtualapplications_play_NativeInterop_resumeVirtualMachine
            Java_com_virtualapplications_play_NativeInterop_pauseVirtualMachine
            Java_com_virtualapplications_play_NativeInterop_bootDiskImage
            Java_com_virtualapplications_play_NativeInterop_setupGsHandler
            Java_com_virtualapplications_play_NativeInterop_notifyPreferencesChanged
            Java_com_virtualapplications_play_NativeInterop_saveState
            Java_com_virtualapplications_play_NativeInterop_loadState
            Java_com_virtualapplications_play_InputManager_setButtonState
            Java_com_virtualapplications_play_InputManager_setAxisState
            Java_com_virtualapplications_play_SettingsManager_save
            Java_com_virtualapplications_play_SettingsManager_setPreferenceBoolean
            Java_com_virtualapplications_play_SettingsManager_setPreferenceInteger
          )
          for ABI in arm64-v8a armeabi-v7a; do
            LIB="app/src/main/jniLibs/$ABI/libPlay.so"
            table="$($READELF -Ws "$LIB")"
            for symbol in "${symbols[@]}"; do
              grep -Fq "$symbol" <<< "$table" || {
                echo "Missing Play gameplay JNI symbol $symbol for $ABI" >&2
                exit 1
              }
            done
          done
          echo "OMNICORE_PS2_ALPHA2_PLAY_JNI_OK input settings state boot"

      - name: Archive corresponding GPL core sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/source-artifacts
          tar --exclude=.git -czf build/source-artifacts/pcsx-rearmed-da2cb8e-source.tar.gz -C third_party pcsx_rearmed
          tar --exclude=.git -czf build/source-artifacts/mupen64plus-next-f275caf-source.tar.gz -C third_party mupen64plus_next

      - name: Build signed OmniCore PS2 Alpha 2 APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          for ABI in arm64-v8a armeabi-v7a; do
            unzip -l "$APK" | grep -q "lib/$ABI/libpcsx_rearmed_libretro.so"
            unzip -l "$APK" | grep -q "lib/$ABI/libmupen64plus_next_libretro.so"
            unzip -l "$APK" | grep -q "lib/$ABI/libPlay.so"
            unzip -l "$APK" | grep -q "lib/$ABI/libomnicore_ps2_runtime.so"
          done
          echo "OMNICORE_PS2_ALPHA2_APK_CONTAINER_OK"

      - name: Verify signer and 16 KB compatibility
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          EXPECTED="9490d1ad4666312d6dd9e5b2a20699583919ae80a5536882bcd3f9accc793547"
          "$APKSIGNER" verify --print-certs "$APK"
          ACTUAL="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL" = "$EXPECTED"
          CHECK_DIR="build/apk-alignment-check"
          rm -rf "$CHECK_DIR" && mkdir -p "$CHECK_DIR"
          unzip -q "$APK" -d "$CHECK_DIR"
          READELF="$OMNI_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          while IFS= read -r -d '' SO; do
            while IFS= read -r LOAD_LINE; do
              ALIGN_HEX="$(awk '{print $NF}' <<< "$LOAD_LINE")"
              [[ "$ALIGN_HEX" =~ ^0x[0-9A-Fa-f]+$ ]]
              (( ALIGN_HEX >= 0x4000 ))
            done < <("$READELF" -lW "$SO" | grep -E '^[[:space:]]*LOAD[[:space:]]')
          done < <(find "$CHECK_DIR/lib" -type f -name '*.so' -print0)
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -v -c -P 16 4 "$APK"
          echo "OMNICORE_PS2_ALPHA2_SIGNER_16KB_OK"

      - name: Publish PS2 Alpha 2 prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v0.11.1-ps2-alpha2"
          TITLE="OmniCore v0.11.1 PS2 Alpha 2"
          NOTES="Second PlayStation 2 device-test alpha. Adds the first OmniCore DualShock 2 touch layer with two analog sticks, D-pad, face buttons, shoulders, L3/R3, Start/Select, multitouch, radial analog precision and an editable per-control layout. Android USB/Bluetooth gamepads feed the same isolated PS2 input boundary. Adds PS2 presets and isolated settings for renderer, framebuffer scale 1x/2x/4x, widescreen, presentation, bilinear filtering, frame limiter and SPU buffering. SmartPerf now applies only proven PS2 backend knobs, preserves the user-selected quality floor and never enables cycle skipping automatically. Adds save/load state slots and an original OmniCore PS2-era classic boot pre-roll (no Sony BIOS/logo/audio assets), with Direct boot available as an option. Uses pinned Play! 04bde0df87ee7c0e2f0151b51bb2cc22c88541da in the :ps2 process. PS1/N64 remain protected and isolated. No games, BIOS, firmware or copyrighted console files are included."
          APK="app/build/outputs/apk/debug/app-debug.apk"
          OUT="build/OmniCore-v0.11.1-ps2-alpha2-debug.apk"
          HASH="build/OmniCore-v0.11.1-ps2-alpha2-debug.sha256"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > "$HASH"
          TARGET="$(git rev-parse HEAD)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --prerelease --target "$TARGET"
          else
            gh release create "$TAG" --target "$TARGET" --title "$TITLE" --notes "$NOTES" --prerelease
          fi
          gh release upload "$TAG" "$OUT" "$HASH" build/source-artifacts/pcsx-rearmed-da2cb8e-source.tar.gz build/source-artifacts/mupen64plus-next-f275caf-source.tar.gz --clobber

      - name: Publish success commit status
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state='success' \
            -f context='omnicore/ps2-alpha2' \
            -f description='PS2 Alpha 2 release validated' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Publish failure commit status
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state='failure' \
            -f context='omnicore/ps2-alpha2' \
            -f description='PS2 Alpha 2 validation failed' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Record PS2 Alpha 2 success
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RESULT=/tmp/ps2-alpha2-success.txt
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "commit=$GITHUB_SHA"
            echo "status=success"
            echo "version=0.11.1"
            echo "tag=v0.11.1-ps2-alpha2"
            echo "play_revision=04bde0df87ee7c0e2f0151b51bb2cc22c88541da"
            echo "abis=arm64-v8a,armeabi-v7a"
            echo "features=dualshock2-touch,physical-pad,settings,smartperf,save-state,classic-boot"
            echo "signer_sha256=9490d1ad4666312d6dd9e5b2a20699583919ae80a5536882bcd3f9accc793547"
          } > "$RESULT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin agent/0.11.0-ps2-foundation
          git reset --hard origin/agent/0.11.0-ps2-foundation
          cp "$RESULT" .ci/ps2-alpha2-success.txt
          rm -f .ci/ps2-alpha2-failure.txt
          git add .ci/ps2-alpha2-success.txt .ci/ps2-alpha2-failure.txt 2>/dev/null || true
          git commit -m "Record PS2 Alpha 2 validation success [skip ci]" || true
          git push origin HEAD:agent/0.11.0-ps2-foundation

      - name: Record PS2 Alpha 2 failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          RESULT=/tmp/ps2-alpha2-failure.txt
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "commit=$GITHUB_SHA"
            echo "status=failure"
            echo "version=0.11.1"
            echo "phase=ps2-alpha2-release"
          } > "$RESULT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin agent/0.11.0-ps2-foundation
          git reset --hard origin/agent/0.11.0-ps2-foundation
          cp "$RESULT" .ci/ps2-alpha2-failure.txt
          git add .ci/ps2-alpha2-failure.txt
          git commit -m "Record PS2 Alpha 2 validation failure [skip ci]" || true
          git push origin HEAD:agent/0.11.0-ps2-foundation || true
