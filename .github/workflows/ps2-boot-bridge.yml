name: PS2 Boot Bridge

on:
  push:
    branches: [ "agent/0.11.0-ps2-foundation" ]
    paths:
      - ".ci/ps2-boot-bridge-trigger.txt"

permissions:
  contents: write

concurrency:
  group: ps2-boot-bridge
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PS2 branch
        uses: actions/checkout@v4
        with:
          ref: agent/0.11.0-ps2-foundation
          fetch-depth: 0

      - name: Protect PS1 and N64 runtimes
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin agent/0.10.0-n64-foundation
          changed="$(git diff --name-only origin/agent/0.10.0-n64-foundation...HEAD)"
          forbidden='^(app/src/main/cpp/(native_bridge\.cpp|gl_presenter\.cpp|libretro_host_v7\.cpp|n64/)|app/src/main/java/com/omnicore/emulator/core/n64/|app/src/main/java/com/omnicore/emulator/emulation/N64|app/src/main/java/com/omnicore/emulator/performance/N64)'
          if echo "$changed" | grep -E "$forbidden"; then
            echo "PS2 Boot Bridge modified protected PS1/N64 runtime source." >&2
            exit 1
          fi
          git diff --check origin/agent/0.10.0-n64-foundation...HEAD

      - name: Verify Android and Play toolchains
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          OMNI_NDK="$ANDROID_SDK_ROOT/ndk/28.2.13676358"
          PLAY_NDK="$ANDROID_SDK_ROOT/ndk/29.0.14206865"
          test -d "$OMNI_NDK"
          if ! test -d "$PLAY_NDK"; then
            yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865"
          fi
          test -d "$PLAY_NDK"
          echo "PLAY_NDK_HOME=$PLAY_NDK" >> "$GITHUB_ENV"
          test -x "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign"

      - name: Fetch pinned Play backend
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/fetch_ps2_play_backend.sh tools/build_ps2_play_backend_android.sh
          tools/fetch_ps2_play_backend.sh
          test "$(git -C build/third_party/play rev-parse HEAD)" = "04bde0df87ee7c0e2f0151b51bb2cc22c88541da"

      - name: Build pinned Play dual ABI
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$PLAY_NDK_HOME"
          export PLAY_ABIS="arm64-v8a armeabi-v7a"
          export PLAY_BUILD_JOBS="2"
          tools/build_ps2_play_backend_android.sh
          test -s app/src/main/jniLibs/arm64-v8a/libPlay.so
          test -s app/src/main/jniLibs/armeabi-v7a/libPlay.so

      - name: Verify real Play boot JNI symbols
        shell: bash
        run: |
          set -euo pipefail
          READELF="$PLAY_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          symbols=(
            Java_com_virtualapplications_play_NativeInterop_setFilesDirPath
            Java_com_virtualapplications_play_NativeInterop_setCacheDirPath
            Java_com_virtualapplications_play_NativeInterop_setContentResolver
            Java_com_virtualapplications_play_NativeInterop_setAssetManager
            Java_com_virtualapplications_play_NativeInterop_createVirtualMachine
            Java_com_virtualapplications_play_NativeInterop_isVirtualMachineCreated
            Java_com_virtualapplications_play_NativeInterop_resumeVirtualMachine
            Java_com_virtualapplications_play_NativeInterop_pauseVirtualMachine
            Java_com_virtualapplications_play_NativeInterop_bootDiskImage
            Java_com_virtualapplications_play_NativeInterop_setupGsHandler
          )
          for ABI in arm64-v8a armeabi-v7a; do
            LIB="app/src/main/jniLibs/$ABI/libPlay.so"
            table="$($READELF -Ws "$LIB")"
            for symbol in "${symbols[@]}"; do
              grep -Fq "$symbol" <<< "$table" || {
                echo "Missing Play JNI symbol $symbol for $ABI" >&2
                exit 1
              }
            done
          done
          echo "OMNICORE_PS2_BOOT_API_SYMBOLS_OK"

      - name: Validate Boot Bridge source isolation
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/main/java/com/virtualapplications/play/NativeInterop.java
          test -f app/src/main/java/com/virtualapplications/play/Bootable.java
          test -f app/src/main/java/com/omnicore/emulator/core/ps2/PlayPS2Backend.kt
          test -f app/src/main/java/com/omnicore/emulator/core/ps2/PS2Core.kt
          grep -Fq 'ConsoleSystem.PLAYSTATION_2 -> PS2Core()' app/src/main/java/com/omnicore/emulator/core/CoreRegistry.kt
          grep -Fq 'android:process=":ps2"' app/src/main/AndroidManifest.xml
          grep -Fq 'NativeInterop.bootDiskImage(request.imagePath)' app/src/main/java/com/omnicore/emulator/core/ps2/PlayPS2Backend.kt
          grep -Fq 'PS2 BOOT OK' app/src/main/java/com/omnicore/emulator/emulation/PS2EmulationActivity.kt

      - name: Build OmniCore Boot Bridge APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          for ABI in arm64-v8a armeabi-v7a; do
            unzip -l "$APK" | grep -q "lib/$ABI/libPlay.so"
            unzip -l "$APK" | grep -q "lib/$ABI/libomnicore_ps2_runtime.so"
          done

      - name: Verify APK 16 KB packaging
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK"
          echo "OMNICORE_PS2_BOOT_BRIDGE1_OK play-jni surface-uri-lifecycle dual-abi 16kb"

      - name: Upload Boot Bridge APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OmniCore-PS2-BootBridge1
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Record Boot Bridge failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          RESULT=/tmp/ps2-boot-bridge-failure.txt
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "commit=$GITHUB_SHA"
            echo "status=failure"
            echo "phase=boot-bridge-1-real-play-jni"
            echo "play_revision=04bde0df87ee7c0e2f0151b51bb2cc22c88541da"
          } > "$RESULT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin agent/0.11.0-ps2-foundation
          git reset --hard origin/agent/0.11.0-ps2-foundation
          cp "$RESULT" .ci/ps2-boot-bridge-failure.txt
          rm -f .ci/ps2-boot-bridge-success.txt
          git add .ci/ps2-boot-bridge-failure.txt .ci/ps2-boot-bridge-success.txt 2>/dev/null || true
          git commit -m "Record PS2 Boot Bridge failure [skip ci]" || true
          git push origin HEAD:agent/0.11.0-ps2-foundation

      - name: Record Boot Bridge success
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          RESULT=/tmp/ps2-boot-bridge-success.txt
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "commit=$GITHUB_SHA"
            echo "status=success"
            echo "phase=boot-bridge-1-real-play-jni"
            echo "play_revision=04bde0df87ee7c0e2f0151b51bb2cc22c88541da"
            echo "backend=libPlay.so"
            echo "abis=arm64-v8a,armeabi-v7a"
            echo "bridge=vm+surface+content-uri+pause-resume"
            echo "renderer_gate=gles3-default"
            echo "apk=artifact:OmniCore-PS2-BootBridge1"
          } > "$RESULT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin agent/0.11.0-ps2-foundation
          git reset --hard origin/agent/0.11.0-ps2-foundation
          cp "$RESULT" .ci/ps2-boot-bridge-success.txt
          rm -f .ci/ps2-boot-bridge-failure.txt
          git add .ci/ps2-boot-bridge-success.txt .ci/ps2-boot-bridge-failure.txt 2>/dev/null || true
          git commit -m "Record PS2 Boot Bridge success [skip ci]" || true
          git push origin HEAD:agent/0.11.0-ps2-foundation
