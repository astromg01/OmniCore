name: Bootstrap OmniCore v0.2.0

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  bootstrap-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Reconstruct OmniCore source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part* > source.b64
          base64 -d source.b64 > source.zip
          rm source.b64
          mkdir extracted
          unzip -q source.zip -d extracted
          test -f extracted/OmniCore/settings.gradle.kts
          cp -a extracted/OmniCore/. .
          rm -rf extracted source.zip .bootstrap
          # GITHUB_TOKEN cannot create/update workflow files. The final
          # android.yml is installed separately after this bootstrap succeeds.
          rm -f .github/workflows/android.yml

      - name: Commit source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import OmniCore v0.2.0 source"
          git push origin HEAD:main

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Fetch pinned PCSX-ReARMed source
        run: ./tools/fetch_ps1_core.sh

      - name: Build PS1 core for Android ARM
        run: ./tools/build_ps1_core_android.sh

      - name: Archive corresponding PS1 core source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/source-artifacts
          tar --exclude=.git -czf build/source-artifacts/pcsx-rearmed-da2cb8e-source.tar.gz -C third_party pcsx_rearmed

      - name: Build OmniCore debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify native 16 KB alignment
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          CHECK_DIR="build/apk-alignment-check"
          rm -rf "$CHECK_DIR"
          mkdir -p "$CHECK_DIR"
          unzip -q "$APK" -d "$CHECK_DIR"
          READELF="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          while IFS= read -r -d '' SO; do
            echo "Checking ELF alignment: $SO"
            while IFS= read -r LOAD_LINE; do
              ALIGN_HEX="$(awk '{print $NF}' <<< "$LOAD_LINE")"
              if [[ ! "$ALIGN_HEX" =~ ^0x[0-9A-Fa-f]+$ ]]; then
                echo "ERROR: Could not parse LOAD alignment: $LOAD_LINE" >&2
                exit 1
              fi
              if (( ALIGN_HEX < 0x4000 )); then
                echo "ERROR: LOAD segment below 16 KB alignment: $LOAD_LINE" >&2
                exit 1
              fi
            done < <("$READELF" -lW "$SO" | grep -E '^[[:space:]]*LOAD[[:space:]]')
          done < <(find "$CHECK_DIR/lib" -type f -name '*.so' -print0)
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -v -c -P 16 4 "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OmniCore-v0.2.0-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload PCSX-ReARMed source bundle
        uses: actions/upload-artifact@v4
        with:
          name: OmniCore-v0.2.0-ps1-core-source
          path: build/source-artifacts/pcsx-rearmed-da2cb8e-source.tar.gz
