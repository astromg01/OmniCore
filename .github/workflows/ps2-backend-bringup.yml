name: PS2 Backend Bring-up

on:
  push:
    branches: [ "agent/0.11.0-ps2-foundation" ]
    paths:
      - ".ci/ps2-backend-bringup-trigger.txt"

permissions:
  contents: write

concurrency:
  group: ps2-backend-bringup
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PS2 branch
        uses: actions/checkout@v4
        with:
          ref: agent/0.11.0-ps2-foundation
          fetch-depth: 0

      - name: Protect PS1 and N64 runtime sources
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin agent/0.10.0-n64-foundation
          changed="$(git diff --name-only origin/agent/0.10.0-n64-foundation...HEAD)"
          forbidden='^(app/src/main/cpp/(native_bridge\.cpp|gl_presenter\.cpp|libretro_host_v7\.cpp|n64/)|app/src/main/java/com/omnicore/emulator/core/n64/|app/src/main/java/com/omnicore/emulator/emulation/N64|app/src/main/java/com/omnicore/emulator/performance/N64)'
          if echo "$changed" | grep -E "$forbidden"; then
            echo "PS2 bring-up modified protected PS1/N64 runtime source." >&2
            exit 1
          fi
          git diff --check origin/agent/0.10.0-n64-foundation...HEAD

      - name: Verify OmniCore and Play toolchains
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          OMNI_NDK="$ANDROID_SDK_ROOT/ndk/28.2.13676358"
          PLAY_NDK="$ANDROID_SDK_ROOT/ndk/29.0.14206865"
          test -d "$OMNI_NDK"
          if ! test -d "$PLAY_NDK"; then
            yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865"
          fi
          test -d "$PLAY_NDK"
          echo "OMNI_NDK_HOME=$OMNI_NDK" >> "$GITHUB_ENV"
          echo "PLAY_NDK_HOME=$PLAY_NDK" >> "$GITHUB_ENV"
          test -x "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign"

      - name: Fetch pinned Play backend
        shell: bash
        run: |
          set -o pipefail
          chmod +x tools/fetch_ps2_play_backend.sh tools/build_ps2_play_backend_android.sh
          tools/fetch_ps2_play_backend.sh 2>&1 | tee /tmp/ps2-bringup.log
          test "$(git -C build/third_party/play rev-parse HEAD)" = "04bde0df87ee7c0e2f0151b51bb2cc22c88541da"

      - name: Build Play dual ABI backend
        shell: bash
        run: |
          set -o pipefail
          export ANDROID_NDK_HOME="$PLAY_NDK_HOME"
          export PLAY_ABIS="arm64-v8a armeabi-v7a"
          export PLAY_BUILD_JOBS="2"
          tools/build_ps2_play_backend_android.sh 2>&1 | tee -a /tmp/ps2-bringup.log
          test -s app/src/main/jniLibs/arm64-v8a/libPlay.so
          test -s app/src/main/jniLibs/armeabi-v7a/libPlay.so

      - name: Verify Play ELF alignment and dependencies
        shell: bash
        run: |
          set -euo pipefail
          READELF="$PLAY_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          for ABI in arm64-v8a armeabi-v7a; do
            LIB="app/src/main/jniLibs/$ABI/libPlay.so"
            "$READELF" -lW "$LIB" | tee -a /tmp/ps2-bringup.log
            "$READELF" -lW "$LIB" | awk '$1 == "LOAD" { count++; if ($NF != "0x4000" && $NF != "0x10000") bad=1 } END { if (count == 0 || bad) exit 1 }'
            "$READELF" -dW "$LIB" | tee -a /tmp/ps2-bringup.log
            if "$READELF" -dW "$LIB" | grep -q 'libc++_shared.so'; then
              echo "Unexpected shared C++ runtime dependency for $ABI" >&2
              exit 1
            fi
          done

      - name: Build OmniCore PS2 container APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee -a /tmp/ps2-bringup.log
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | tee -a /tmp/ps2-bringup.log
          for ABI in arm64-v8a armeabi-v7a; do
            unzip -l "$APK" | grep -q "lib/$ABI/libPlay.so"
            unzip -l "$APK" | grep -q "lib/$ABI/libomnicore_ps2_runtime.so"
          done

      - name: Verify APK 16 KB packaging
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK" | tee -a /tmp/ps2-bringup.log

      - name: Record bring-up failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          RESULT=/tmp/ps2-backend-bringup-failure.txt
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "commit=$GITHUB_SHA"
            echo "status=failure"
            echo "phase=backend-bringup-2-dualabi-apk"
            echo "play_revision=04bde0df87ee7c0e2f0151b51bb2cc22c88541da"
            echo
            echo "--- build tail ---"
            if test -f /tmp/ps2-bringup.log; then tail -n 260 /tmp/ps2-bringup.log; fi
          } > "$RESULT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin agent/0.11.0-ps2-foundation
          git reset --hard origin/agent/0.11.0-ps2-foundation
          cp "$RESULT" .ci/ps2-backend-bringup-failure.txt
          rm -f .ci/ps2-backend-bringup-success.txt
          git add .ci/ps2-backend-bringup-failure.txt .ci/ps2-backend-bringup-success.txt 2>/dev/null || true
          git commit -m "Record PS2 bring-up 2 failure [skip ci]" || true
          git push origin HEAD:agent/0.11.0-ps2-foundation

      - name: Record bring-up success
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          RESULT=/tmp/ps2-backend-bringup-success.txt
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "commit=$GITHUB_SHA"
            echo "status=success"
            echo "phase=backend-bringup-2-dualabi-apk"
            echo "play_revision=04bde0df87ee7c0e2f0151b51bb2cc22c88541da"
            echo "backend=libPlay.so"
            echo "abis=arm64-v8a,armeabi-v7a"
            echo "container_apk=app-debug.apk"
            echo "ps2_runtime=libomnicore_ps2_runtime.so"
          } > "$RESULT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin agent/0.11.0-ps2-foundation
          git reset --hard origin/agent/0.11.0-ps2-foundation
          cp "$RESULT" .ci/ps2-backend-bringup-success.txt
          rm -f .ci/ps2-backend-bringup-failure.txt
          git add .ci/ps2-backend-bringup-success.txt .ci/ps2-backend-bringup-failure.txt 2>/dev/null || true
          git commit -m "Record PS2 bring-up 2 success [skip ci]" || true
          git push origin HEAD:agent/0.11.0-ps2-foundation

      - name: Bring-up summary
        if: success()
        run: echo "Play! dual-ABI backend and OmniCore PS2 runtime are packaged in a 16 KB-aligned APK. Boot Bridge is the next gate."
