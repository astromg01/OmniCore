name: Alpha 8 Diagnostic

on:
  push:
    branches: [ "agent/0.10.0-n64-foundation" ]
    paths:
      - ".ci/alpha8-diagnostic-trigger.txt"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Clone branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags origin agent/0.10.0-n64-foundation
          git checkout -B agent/0.10.0-n64-foundation origin/agent/0.10.0-n64-foundation

      - name: Diagnose signed Alpha 8 packaging
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/28.2.13676358"
          mkdir -p .ci build/signing build/source-artifacts
          STAGE="migration"
          CODE=0
          : > /tmp/alpha8-signed.log

          python3 tools/agent_0107_alpha8.py >> /tmp/alpha8-signed.log 2>&1
          CODE=$?

          if [ "$CODE" -eq 0 ]; then
            STAGE="prepare_signing"
            base64 -d config/omnicore-dev.keystore.b64 > build/signing/omnicore-dev.jks 2>> /tmp/alpha8-signed.log
            CODE=$?
            if [ "$CODE" -eq 0 ]; then
              chmod 600 build/signing/omnicore-dev.jks
              export OMNICORE_DEV_KEYSTORE="$GITHUB_WORKSPACE/build/signing/omnicore-dev.jks"
              export OMNICORE_DEV_STORE_PASSWORD="omnicore-dev-2026"
              export OMNICORE_DEV_KEY_ALIAS="omnicore-dev"
              export OMNICORE_DEV_KEY_PASSWORD="omnicore-dev-2026"
              keytool -list -keystore "$OMNICORE_DEV_KEYSTORE" -storepass "$OMNICORE_DEV_STORE_PASSWORD" -alias "$OMNICORE_DEV_KEY_ALIAS" >> /tmp/alpha8-signed.log 2>&1
              CODE=$?
            fi
          fi

          if [ "$CODE" -eq 0 ]; then
            STAGE="fast_compile"
            gradle :app:externalNativeBuildDebug :app:compileDebugKotlin --stacktrace --no-daemon >> /tmp/alpha8-signed.log 2>&1
            CODE=$?
          fi

          if [ "$CODE" -eq 0 ]; then
            STAGE="build_ps1"
            chmod +x tools/fetch_ps1_core.sh tools/build_ps1_core_android.sh
            (./tools/fetch_ps1_core.sh && ./tools/build_ps1_core_android.sh) >> /tmp/alpha8-signed.log 2>&1
            CODE=$?
          fi

          if [ "$CODE" -eq 0 ]; then
            STAGE="build_n64"
            chmod +x tools/fetch_n64_core.sh tools/build_n64_core_android.sh
            (./tools/fetch_n64_core.sh && ./tools/build_n64_core_android.sh) >> /tmp/alpha8-signed.log 2>&1
            CODE=$?
          fi

          if [ "$CODE" -eq 0 ]; then
            STAGE="assemble"
            gradle :app:assembleDebug --stacktrace --no-daemon >> /tmp/alpha8-signed.log 2>&1
            CODE=$?
          fi

          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ "$CODE" -eq 0 ]; then
            STAGE="signing"
            APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
            EXPECTED="9490d1ad4666312d6dd9e5b2a20699583919ae80a5536882bcd3f9accc793547"
            "$APKSIGNER" verify --print-certs "$APK" >> /tmp/alpha8-signed.log 2>&1
            VERIFY=$?
            ACTUAL="$("$APKSIGNER" verify --print-certs "$APK" 2>/dev/null | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
            echo "SIGNER_ACTUAL=$ACTUAL" >> /tmp/alpha8-signed.log
            if [ "$VERIFY" -ne 0 ] || [ "$ACTUAL" != "$EXPECTED" ]; then CODE=1; else CODE=0; fi
          fi

          if [ "$CODE" -eq 0 ]; then
            STAGE="alignment"
            CHECK_DIR="build/apk-alignment-check"
            rm -rf "$CHECK_DIR" && mkdir -p "$CHECK_DIR"
            unzip -q "$APK" -d "$CHECK_DIR"
            READELF="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
            CODE=0
            while IFS= read -r -d '' SO; do
              while IFS= read -r LOAD_LINE; do
                ALIGN_HEX="$(awk '{print $NF}' <<< "$LOAD_LINE")"
                if ! [[ "$ALIGN_HEX" =~ ^0x[0-9A-Fa-f]+$ ]] || (( ALIGN_HEX < 0x4000 )); then
                  echo "BAD ALIGN: $SO :: $LOAD_LINE" >> /tmp/alpha8-signed.log
                  CODE=1
                fi
              done < <("$READELF" -lW "$SO" | grep -E '^[[:space:]]*LOAD[[:space:]]')
            done < <(find "$CHECK_DIR/lib" -type f -name '*.so' -print0)
            if [ "$CODE" -eq 0 ]; then
              "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -v -c -P 16 4 "$APK" >> /tmp/alpha8-signed.log 2>&1
              CODE=$?
            fi
          fi

          {
            if [ "$CODE" -eq 0 ]; then
              echo "stage=all_signed_pre_publish_success"
            else
              echo "stage=$STAGE"
            fi
            echo "exit_code=$CODE"
            echo "run_id=$GITHUB_RUN_ID"
            echo "commit=$GITHUB_SHA"
            echo "--- focused ---"
            grep -nEi "ERROR|FAILURE|FAILED|BAD ALIGN|SIGNER_ACTUAL|expected exactly one match" /tmp/alpha8-signed.log | tail -n 160 || true
            echo "--- tail ---"
            tail -n 260 /tmp/alpha8-signed.log
          } > /tmp/result.txt

          git reset --hard HEAD
          cp /tmp/result.txt .ci/alpha8-diagnostic-result.txt
          git config user.name "Mauricio.dev"
          git config user.email "antoniomauriciorodriguesalves@gmail.com"
          git add .ci/alpha8-diagnostic-result.txt
          git commit -m "Record Alpha 8 signed packaging diagnostic [skip ci]" || true
          git push origin HEAD:agent/0.10.0-n64-foundation
