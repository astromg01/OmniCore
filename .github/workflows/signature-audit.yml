name: Signature Audit

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/signature-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Download released APKs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p audit
          gh release download v0.4.0-dev --repo "$GITHUB_REPOSITORY" --pattern 'OmniCore-v0.4.0-debug.apk' --dir audit
          gh release download v0.5.0-dev --repo "$GITHUB_REPOSITORY" --pattern 'OmniCore-v0.5.0-debug.apk' --dir audit

      - name: Compare signing certificates
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          for APK in audit/*.apk; do
            echo "=== $APK ==="
            "$APKSIGNER" verify --print-certs "$APK" | grep -E 'Signer #1 certificate (SHA-256 digest|DN)'
          done
