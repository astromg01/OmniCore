name: Runtime v5 Migration

on:
  push:
    paths:
      - ".github/workflows/runtime-v5-migration.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Clone repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags origin main
          git checkout -B main origin/main

      - name: Apply runtime v5 migration
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_runtime_v5.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/cpp/libretro_host_v5.cpp
          git add app/src/main/cpp/CMakeLists.txt
          git add app/src/main/java/com/omnicore/emulator/settings/Ps1Settings.kt
          git add app/src/main/java/com/omnicore/emulator/storage/Ps1BiosHealth.kt
          git add app/src/main/java/com/omnicore/emulator/emulation/EmulationActivity.kt
          git add app/build.gradle.kts CHANGELOG.md
          git commit -m "Build OmniCore runtime v5 foundation"
          git push origin HEAD:main
