name: Android Build

on:
  push:
    branches: [ "agent/0.10.0-n64-foundation" ]

permissions:
  contents: write

concurrency:
  group: android-n64-foundation
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Clone N64 foundation branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags origin agent/0.10.0-n64-foundation
          git checkout -B agent/0.10.0-n64-foundation origin/agent/0.10.0-n64-foundation

      - name: Validate multi-system Alpha 5 architecture
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 20' app/build.gradle.kts
          grep -q 'versionName = "0.10.4"' app/build.gradle.kts
          grep -q 'OmniCoreV4App' app/src/main/java/com/omnicore/emulator/MainActivity.kt
          grep -q 'N64Diagnostics.consumeRecentProcessExit' app/src/main/java/com/omnicore/emulator/MainActivity.kt
          grep -q 'android:name=".OmniCoreApplication"' app/src/main/AndroidManifest.xml
          grep -q 'android:process=":n64"' app/src/main/AndroidManifest.xml
          grep -q 'Thread.setDefaultUncaughtExceptionHandler' app/src/main/java/com/omnicore/emulator/OmniCoreApplication.kt
          grep -q 'recordJavaCrash' app/src/main/java/com/omnicore/emulator/core/n64/N64Diagnostics.kt
          grep -q 'getHistoricalProcessExitReasons' app/src/main/java/com/omnicore/emulator/core/n64/N64Diagnostics.kt
          grep -q 'activity:onCreate_enter' app/src/main/java/com/omnicore/emulator/emulation/N64EmulationActivity.kt
          grep -q 'scheduleImmersiveMode' app/src/main/java/com/omnicore/emulator/emulation/N64EmulationActivity.kt
          grep -q 'decor.isAttachedToWindow' app/src/main/java/com/omnicore/emulator/emulation/N64EmulationActivity.kt
          grep -q 'decor.windowInsetsController' app/src/main/java/com/omnicore/emulator/emulation/N64EmulationActivity.kt
          ! grep -q 'window.insetsController' app/src/main/java/com/omnicore/emulator/emulation/N64EmulationActivity.kt
          grep -q 'prepare:probe_core' app/src/main/java/com/omnicore/emulator/emulation/N64EmulationActivity.kt
          grep -q 'session:native_start' app/src/main/java/com/omnicore/emulator/emulation/N64EmulationActivity.kt
          grep -q 'CACHED_INTERPRETER' app/src/main/java/com/omnicore/emulator/emulation/N64EmulationActivity.kt
          grep -q 'LibraryImportEngine' app/src/main/java/com/omnicore/emulator/ui/OmniCoreV4App.kt
          grep -q 'Uma biblioteca. Vários sistemas.' app/src/main/java/com/omnicore/emulator/ui/OmniCoreV4App.kt
          grep -q 'ConsoleSystem.NINTENDO_64 -> N64Core()' app/src/main/java/com/omnicore/emulator/core/CoreRegistry.kt
          grep -q 'N64RomContainer.ZIP' app/src/main/java/com/omnicore/emulator/core/n64/N64RomPreparer.kt
          grep -q 'N64RomContainer.GZIP' app/src/main/java/com/omnicore/emulator/core/n64/N64RomPreparer.kt
          grep -q '"u1"' app/src/main/java/com/omnicore/emulator/core/n64/N64RomValidator.kt
          grep -q 'isNintendo64' app/src/main/java/com/omnicore/emulator/library/LibraryImportEngine.kt
          grep -q 'threadedRenderer = false' app/src/main/java/com/omnicore/emulator/performance/N64SmartPerf.kt
          grep -q 'OmniCore-N64Diag' app/src/main/java/com/omnicore/emulator/core/n64/N64NativeBridge.kt
          grep -q 'failed to allocate ROM buffer' tools/fetch_n64_core.sh
          grep -q 'omnicore_n64_runtime' app/src/main/cpp/CMakeLists.txt
          grep -q 'n64_libretro_host.cpp' app/src/main/cpp/CMakeLists.txt
          grep -q '\${aaudio-lib}' app/src/main/cpp/CMakeLists.txt
          grep -q 'N64GamepadOverlayView' app/src/main/java/com/omnicore/emulator/emulation/N64EmulationActivity.kt
          grep -q 'AAudioStreamBuilder_setPerformanceMode' app/src/main/cpp/n64/n64_libretro_host.cpp
          grep -q 'N64 RUN OK' app/src/main/cpp/n64/n64_libretro_host.cpp
          grep -q 'RETRO_ENVIRONMENT_SET_HW_RENDER' app/src/main/cpp/n64/n64_libretro_host.cpp
          grep -q 'glBlitFramebuffer' app/src/main/cpp/n64/n64_libretro_host.cpp
          git diff --check

      - name: Verify Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/28.2.13676358"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          java -version
          gradle --version
          test -d "$ANDROID_SDK_ROOT/platforms/android-36"
          test -x "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign"
          test -x "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          test -x "$ANDROID_NDK_HOME/ndk-build"
          test -x "$ANDROID_SDK_ROOT/cmake/3.31.5/bin/cmake"

      - name: Prepare stable DEV signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/signing
          base64 -d config/omnicore-dev.keystore.b64 > build/signing/omnicore-dev.jks
          chmod 600 build/signing/omnicore-dev.jks
          echo "OMNICORE_DEV_KEYSTORE=$GITHUB_WORKSPACE/build/signing/omnicore-dev.jks" >> "$GITHUB_ENV"
          echo "OMNICORE_DEV_STORE_PASSWORD=omnicore-dev-2026" >> "$GITHUB_ENV"
          echo "OMNICORE_DEV_KEY_ALIAS=omnicore-dev" >> "$GITHUB_ENV"
          echo "OMNICORE_DEV_KEY_PASSWORD=omnicore-dev-2026" >> "$GITHUB_ENV"
          keytool -list -keystore build/signing/omnicore-dev.jks -storepass omnicore-dev-2026 -alias omnicore-dev

      - name: Fast compile native host and Kotlin
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:externalNativeBuildDebug :app:compileDebugKotlin --stacktrace --no-daemon

      - name: Build isolated PS1 core
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/fetch_ps1_core.sh tools/build_ps1_core_android.sh
          ./tools/fetch_ps1_core.sh
          ./tools/build_ps1_core_android.sh

      - name: Build isolated N64 core
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/fetch_n64_core.sh tools/build_n64_core_android.sh
          ./tools/fetch_n64_core.sh
          ./tools/build_n64_core_android.sh

      - name: Verify core coexistence
        shell: bash
        run: |
          set -euo pipefail
          for ABI in arm64-v8a armeabi-v7a; do
            test -f "app/src/main/jniLibs/$ABI/libpcsx_rearmed_libretro.so"
            test -f "app/src/main/jniLibs/$ABI/libmupen64plus_next_libretro.so"
          done

      - name: Archive corresponding core sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/source-artifacts
          tar --exclude=.git -czf build/source-artifacts/pcsx-rearmed-da2cb8e-source.tar.gz -C third_party pcsx_rearmed
          tar --exclude=.git -czf build/source-artifacts/mupen64plus-next-f275caf-source.tar.gz -C third_party mupen64plus_next

      - name: Build signed 0.10.4 N64 Alpha 5 APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify stable DEV signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          EXPECTED="9490d1ad4666312d6dd9e5b2a20699583919ae80a5536882bcd3f9accc793547"
          "$APKSIGNER" verify --print-certs "$APK"
          ACTUAL="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL" = "$EXPECTED" || { echo "ERROR: unexpected DEV signing certificate: $ACTUAL" >&2; exit 1; }

      - name: Verify native 16 KB alignment
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          CHECK_DIR="build/apk-alignment-check"
          rm -rf "$CHECK_DIR"
          mkdir -p "$CHECK_DIR"
          unzip -q "$APK" -d "$CHECK_DIR"
          READELF="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          while IFS= read -r -d '' SO; do
            while IFS= read -r LOAD_LINE; do
              ALIGN_HEX="$(awk '{print $NF}' <<< "$LOAD_LINE")"
              [[ "$ALIGN_HEX" =~ ^0x[0-9A-Fa-f]+$ ]] || exit 1
              (( ALIGN_HEX >= 0x4000 )) || { echo "ERROR: LOAD segment below 16 KB alignment: $LOAD_LINE" >&2; exit 1; }
            done < <("$READELF" -lW "$SO" | grep -E '^[[:space:]]*LOAD[[:space:]]')
          done < <(find "$CHECK_DIR/lib" -type f -name '*.so' -print0)
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -v -c -P 16 4 "$APK"

      - name: Publish N64 Alpha 5 prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v0.10.4-n64-alpha5"
          TITLE="OmniCore v0.10.4 N64 Alpha 5"
          NOTES="Fifth Nintendo 64 device-test alpha. Alpha 4 diagnostics identified the launch failure precisely: Android threw a NullPointerException from PhoneWindow/DecorView while N64EmulationActivity requested WindowInsetsController before the DecorView had attached. Alpha 5 removes that early window.insetsController call. Immersive mode is now scheduled after setContentView, only executes on an attached DecorView, uses decorView.windowInsetsController, retries on window focus, and is guarded so a framework fullscreen failure cannot terminate N64 startup. All Alpha 4 boot breadcrumbs, Java/Kotlin crash capture, safe first-boot Cached Interpreter profile, isolated :n64 process, mixed PS1/N64 library scanning, ZIP/GZIP ROM preparation, stable DEV signing and 16 KB alignment remain intact. PS1 is unchanged. ROMs, BIOS, firmware, keys and games are not included."
          APK="app/build/outputs/apk/debug/app-debug.apk"
          PS1_SOURCE="build/source-artifacts/pcsx-rearmed-da2cb8e-source.tar.gz"
          N64_SOURCE="build/source-artifacts/mupen64plus-next-f275caf-source.tar.gz"
          TARGET="$(git rev-parse HEAD)"
          OUT="build/OmniCore-v0.10.4-n64-alpha5-debug.apk"
          HASH="build/OmniCore-v0.10.4-n64-alpha5-debug.sha256"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > "$HASH"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --prerelease --target "$TARGET"
          else
            gh release create "$TAG" --target "$TARGET" --title "$TITLE" --notes "$NOTES" --prerelease
          fi
          gh release upload "$TAG" "$OUT" "$HASH" "$PS1_SOURCE" "$N64_SOURCE" --clobber
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '{tag_name,name,draft,prerelease,html_url,assets:[.assets[]|{name,size,digest}]}'

      - name: Record validation success
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .ci
          rm -f .ci/n64-foundation-failure.txt
          printf 'run_id=%s\ncommit=%s\nstatus=success\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > .ci/n64-foundation-success.txt
          git config user.name "Mauricio.dev"
          git config user.email "antoniomauriciorodriguesalves@gmail.com"
          git add .ci
          git commit -m "Record signed N64 Alpha 5 validation success [skip ci]" || true
          git push origin HEAD:agent/0.10.0-n64-foundation || true

      - name: Record validation failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          [[ -d .git ]] || exit 0
          mkdir -p .ci
          rm -f .ci/n64-foundation-success.txt
          printf 'run_id=%s\ncommit=%s\nstatus=failure\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > .ci/n64-foundation-failure.txt
          git config user.name "Mauricio.dev"
          git config user.email "antoniomauriciorodriguesalves@gmail.com"
          git add .ci
          git commit -m "Record signed N64 Alpha 5 validation failure [skip ci]" || true
          git push origin HEAD:agent/0.10.0-n64-foundation || true
