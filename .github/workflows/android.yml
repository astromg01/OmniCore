name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Clone repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags origin main
          git checkout -B main origin/main

      - name: Validate 0.9.3 clean overlay and cheats foundation
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionName = "0.9.3"' app/build.gradle.kts
          grep -q 'OmniCore Native Runtime 0.9.3' app/src/main/cpp/native_bridge.cpp
          grep -q 'libretro_host_v7.cpp' app/src/main/cpp/CMakeLists.txt
          grep -q 'gl_presenter.cpp' app/src/main/cpp/CMakeLists.txt
          grep -q 'GLESv2' app/src/main/cpp/CMakeLists.txt
          test -f app/src/main/cpp/libretro_host_v7.cpp
          test -f app/src/main/cpp/gl_presenter.cpp
          test -f app/src/main/java/com/omnicore/emulator/update/UpdateManager.kt
          test -f app/src/main/java/com/omnicore/emulator/update/UpdateInstallReceiver.kt
          test -f app/src/main/java/com/omnicore/emulator/settings/InputSettings.kt
          test -f app/src/main/java/com/omnicore/emulator/cheats/CheatStore.kt
          grep -q 'EGL-GLES presenter' app/src/main/cpp/native_bridge.cpp
          grep -q 'setWillNotDraw(true)' app/src/main/java/com/omnicore/emulator/emulation/EmulationActivity.kt
          grep -q 'pcsx_rearmed_rgb32_output=enabled' app/src/main/java/com/omnicore/emulator/settings/Ps1Settings.kt
          grep -q 'pcsx_rearmed_show_bios_bootlogo' app/src/main/java/com/omnicore/emulator/settings/Ps1Settings.kt
          grep -q 'ps1-disc-cache' app/src/main/java/com/omnicore/emulator/emulation/EmulationActivity.kt
          grep -q 'AspectMode.WIDE_16_9' app/src/main/java/com/omnicore/emulator/emulation/EmulationActivity.kt
          grep -q 'AnalogMode.SMART' app/src/main/java/com/omnicore/emulator/emulation/GamepadOverlayView.kt
          grep -q 'dpadProjection' app/src/main/java/com/omnicore/emulator/emulation/GamepadOverlayView.kt
          grep -q 'EDITAR CONTROLES' app/src/main/java/com/omnicore/emulator/emulation/GamepadOverlayView.kt
          grep -q 'findButtonAt' app/src/main/java/com/omnicore/emulator/emulation/GamepadOverlayView.kt
          grep -q 'OverlayPreset.TABLET' app/src/main/java/com/omnicore/emulator/emulation/GamepadOverlayView.kt
          grep -q 'CheatStore' app/src/main/java/com/omnicore/emulator/emulation/GamepadOverlayView.kt
          grep -q 'nativeSetCheat' app/src/main/java/com/omnicore/emulator/core/nativebridge/NativeBridge.kt
          grep -q 'retro_cheat_set' app/src/main/cpp/libretro_host_v7.cpp
          grep -q 'OmniCore-StatePrefetch' app/src/main/java/com/omnicore/emulator/core/nativebridge/NativeBridge.kt
          grep -q 'warmRuntimeCaches' app/src/main/java/com/omnicore/emulator/MainActivity.kt
          grep -q 'Mostrar setas do D-pad' app/src/main/java/com/omnicore/emulator/ui/OmniCoreV3App.kt
          grep -q 'Quick Menu' app/src/main/java/com/omnicore/emulator/ui/OmniCoreV3App.kt
          grep -q 'Informações do OmniCore' app/src/main/java/com/omnicore/emulator/ui/OmniCoreV3App.kt
          grep -q 'Buscar na biblioteca' app/src/main/java/com/omnicore/emulator/ui/OmniCoreV3App.kt
          grep -q 'Remover da biblioteca?' app/src/main/java/com/omnicore/emulator/ui/OmniCoreV3App.kt
          ! grep -q 'libretro_host_v6.cpp' app/src/main/cpp/CMakeLists.txt

      - name: Verify Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/28.2.13676358"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          java -version
          gradle --version
          test -d "$ANDROID_SDK_ROOT/platforms/android-36"
          test -x "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign"
          test -x "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          test -x "$ANDROID_NDK_HOME/ndk-build"
          test -x "$ANDROID_SDK_ROOT/cmake/3.31.5/bin/cmake"

      - name: Prepare stable DEV signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/signing
          base64 -d config/omnicore-dev.keystore.b64 > build/signing/omnicore-dev.jks
          chmod 600 build/signing/omnicore-dev.jks
          echo "OMNICORE_DEV_KEYSTORE=$GITHUB_WORKSPACE/build/signing/omnicore-dev.jks" >> "$GITHUB_ENV"
          echo "OMNICORE_DEV_STORE_PASSWORD=omnicore-dev-2026" >> "$GITHUB_ENV"
          echo "OMNICORE_DEV_KEY_ALIAS=omnicore-dev" >> "$GITHUB_ENV"
          echo "OMNICORE_DEV_KEY_PASSWORD=omnicore-dev-2026" >> "$GITHUB_ENV"
          keytool -list -keystore build/signing/omnicore-dev.jks -storepass omnicore-dev-2026 -alias omnicore-dev

      - name: Fetch pinned PCSX-ReARMed source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/fetch_ps1_core.sh tools/build_ps1_core_android.sh
          ./tools/fetch_ps1_core.sh

      - name: Build PS1 core for Android ARM
        shell: bash
        run: |
          set -euo pipefail
          ./tools/build_ps1_core_android.sh

      - name: Archive corresponding PS1 core source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/source-artifacts
          tar --exclude=.git -czf build/source-artifacts/pcsx-rearmed-da2cb8e-source.tar.gz -C third_party pcsx_rearmed

      - name: Build OmniCore debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify stable DEV signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          EXPECTED="9490d1ad4666312d6dd9e5b2a20699583919ae80a5536882bcd3f9accc793547"
          "$APKSIGNER" verify --print-certs "$APK"
          ACTUAL="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL" = "$EXPECTED" || { echo "ERROR: unexpected DEV signing certificate: $ACTUAL" >&2; exit 1; }
          echo "Stable DEV signer verified: $ACTUAL"

      - name: Verify native 16 KB alignment
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          CHECK_DIR="build/apk-alignment-check"
          rm -rf "$CHECK_DIR"
          mkdir -p "$CHECK_DIR"
          unzip -q "$APK" -d "$CHECK_DIR"
          READELF="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          while IFS= read -r -d '' SO; do
            echo "Checking ELF alignment: $SO"
            while IFS= read -r LOAD_LINE; do
              ALIGN_HEX="$(awk '{print $NF}' <<< "$LOAD_LINE")"
              if [[ ! "$ALIGN_HEX" =~ ^0x[0-9A-Fa-f]+$ ]]; then
                echo "ERROR: Could not parse LOAD alignment: $LOAD_LINE" >&2
                exit 1
              fi
              if (( ALIGN_HEX < 0x4000 )); then
                echo "ERROR: LOAD segment below 16 KB alignment: $LOAD_LINE" >&2
                exit 1
              fi
            done < <("$READELF" -lW "$SO" | grep -E '^[[:space:]]*LOAD[[:space:]]')
          done < <(find "$CHECK_DIR/lib" -type f -name '*.so' -print0)
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -v -c -P 16 4 "$APK"

      - name: Publish development APK and source bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v0.9.3-dev"
          TITLE="OmniCore v0.9.3 Clean Overlay & Cheat Manager"
          NOTES="Clean gameplay UI and per-game customization update on top of the validated Runtime v7/EGL-GLES foundation. The always-visible save/load/status/exit bars are retired by the Clean Overlay layer and replaced with a compact Quick Menu opened by the small ⋮ control or a three-finger gesture. Four fingers toggle an ultra-immersive overlay mode. Touch controls now support dynamic idle opacity, optional labels, shoulder visibility, START/SELECT visibility, D-pad visibility and six layout presets: Clean, Compact, Standard, Left hand, Right hand and Tablet. Layout positions and visual choices can be stored per game while global defaults remain available. The editor is only shown when requested instead of occupying the playfield. A per-game Cheat Manager stores named codes, toggles them live and applies them through PCSX-ReARMed libretro retro_cheat_reset/retro_cheat_set on the emulation thread. Existing Smart analog, nearest-button multitouch, save-state prefetch, CUE/BIN cache, controller support, BIOS boot, aspect modes, AAudio and SmartPerf remain intact. Uses the same stable DEV signing certificate and updates in place. ROMs, BIOS, firmware, console keys and cheat databases are not included."
          APK="app/build/outputs/apk/debug/app-debug.apk"
          SOURCE="build/source-artifacts/pcsx-rearmed-da2cb8e-source.tar.gz"
          TARGET="$(git rev-parse HEAD)"

          cp "$APK" build/OmniCore-v0.9.3-debug.apk
          sha256sum build/OmniCore-v0.9.3-debug.apk > build/OmniCore-v0.9.3-debug.sha256

          backoff_sleep() {
            local attempt="$1"
            local delay=$((5 * (1 << (attempt - 1))))
            if (( delay > 40 )); then delay=40; fi
            echo "GitHub API unavailable; retrying in ${delay}s (attempt ${attempt}/7)..."
            sleep "$delay"
          }

          ensure_release() {
            local attempt
            for attempt in 1 2 3 4 5 6 7; do
              if gh release view "$TAG" >/dev/null 2>&1; then
                if gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --prerelease --target "$TARGET"; then return 0; fi
              else
                if gh release create "$TAG" --target "$TARGET" --title "$TITLE" --notes "$NOTES" --prerelease; then return 0; fi
                if gh release view "$TAG" >/dev/null 2>&1; then
                  if gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --prerelease --target "$TARGET"; then return 0; fi
                fi
              fi
              if (( attempt < 7 )); then backoff_sleep "$attempt"; fi
            done
            return 1
          }

          upload_assets() {
            local attempt
            for attempt in 1 2 3 4 5 6 7; do
              if gh release upload "$TAG" \
                build/OmniCore-v0.9.3-debug.apk \
                build/OmniCore-v0.9.3-debug.sha256 \
                "$SOURCE" --clobber; then return 0; fi
              if (( attempt < 7 )); then backoff_sleep "$attempt"; fi
            done
            return 1
          }

          ensure_release
          upload_assets
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            --jq '{tag_name,name,draft,prerelease,html_url,assets:[.assets[]|{name,size,digest}]}'
