name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Clone repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags origin main
          git checkout -B main origin/main

      - name: Validate runtime foundation
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionName = "0.4.0"' app/build.gradle.kts
          grep -q 'libretro_host_v5.cpp' app/src/main/cpp/CMakeLists.txt
          test -f app/src/main/cpp/libretro_host_v5.cpp
          test -f app/src/main/java/com/omnicore/emulator/storage/Ps1BiosHealth.kt
          ! grep -q 'libretro_host_v4.cpp' app/src/main/cpp/CMakeLists.txt

      - name: Verify Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/28.2.13676358"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          java -version
          gradle --version
          test -d "$ANDROID_SDK_ROOT/platforms/android-36"
          test -x "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign"
          test -x "$ANDROID_NDK_HOME/ndk-build"
          test -x "$ANDROID_SDK_ROOT/cmake/3.31.5/bin/cmake"

      - name: Fetch pinned PCSX-ReARMed source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/fetch_ps1_core.sh tools/build_ps1_core_android.sh
          ./tools/fetch_ps1_core.sh

      - name: Build PS1 core for Android ARM
        shell: bash
        run: |
          set -euo pipefail
          ./tools/build_ps1_core_android.sh

      - name: Archive corresponding PS1 core source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/source-artifacts
          tar --exclude=.git -czf build/source-artifacts/pcsx-rearmed-da2cb8e-source.tar.gz -C third_party pcsx_rearmed

      - name: Build OmniCore debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify native 16 KB alignment
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          CHECK_DIR="build/apk-alignment-check"
          rm -rf "$CHECK_DIR"
          mkdir -p "$CHECK_DIR"
          unzip -q "$APK" -d "$CHECK_DIR"
          READELF="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          while IFS= read -r -d '' SO; do
            echo "Checking ELF alignment: $SO"
            while IFS= read -r LOAD_LINE; do
              ALIGN_HEX="$(awk '{print $NF}' <<< "$LOAD_LINE")"
              if [[ ! "$ALIGN_HEX" =~ ^0x[0-9A-Fa-f]+$ ]]; then
                echo "ERROR: Could not parse LOAD alignment: $LOAD_LINE" >&2
                exit 1
              fi
              if (( ALIGN_HEX < 0x4000 )); then
                echo "ERROR: LOAD segment below 16 KB alignment: $LOAD_LINE" >&2
                exit 1
              fi
            done < <("$READELF" -lW "$SO" | grep -E '^[[:space:]]*LOAD[[:space:]]')
          done < <(find "$CHECK_DIR/lib" -type f -name '*.so' -print0)
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -v -c -P 16 4 "$APK"

      - name: Publish development APK and source bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v0.4.0-dev"
          TITLE="OmniCore v0.4.0 Runtime Foundation"
          NOTES="Major PS1 runtime foundation revision. Replaces the experimental direct Surface framebuffer with a compatibility-first video path, adds primed low-latency AAudio with bounded buffering and sample-rate adaptation, hybrid A/V timing with live runtime telemetry, corrected PCSX-ReARMed core option values, BIOS/HLE health reporting, and preserves CUE/BIN validation, DualShock touch input, save RAM, save states, SmartPerf and the immersive frontend. Includes the pinned PCSX-ReARMed source bundle. ROMs, BIOS, firmware and keys are not included."
          APK="app/build/outputs/apk/debug/app-debug.apk"
          SOURCE="build/source-artifacts/pcsx-rearmed-da2cb8e-source.tar.gz"
          TARGET="$(git rev-parse HEAD)"

          cp "$APK" build/OmniCore-v0.4.0-debug.apk
          sha256sum build/OmniCore-v0.4.0-debug.apk > build/OmniCore-v0.4.0-debug.sha256

          backoff_sleep() {
            local attempt="$1"
            local delay=$((5 * (1 << (attempt - 1))))
            if (( delay > 40 )); then delay=40; fi
            echo "GitHub API unavailable; retrying in ${delay}s (attempt ${attempt}/7)..."
            sleep "$delay"
          }

          ensure_release() {
            local attempt
            for attempt in 1 2 3 4 5 6 7; do
              if gh release view "$TAG" >/dev/null 2>&1; then
                if gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --prerelease --target "$TARGET"; then
                  return 0
                fi
              else
                if gh release create "$TAG" --target "$TARGET" --title "$TITLE" --notes "$NOTES" --prerelease; then
                  return 0
                fi
                # A create request may have succeeded server-side even when the
                # response was lost. Re-check before the next attempt.
                if gh release view "$TAG" >/dev/null 2>&1; then
                  if gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --prerelease --target "$TARGET"; then
                    return 0
                  fi
                fi
              fi
              if (( attempt < 7 )); then backoff_sleep "$attempt"; fi
            done
            echo "ERROR: GitHub Release API remained unavailable after retries." >&2
            return 1
          }

          upload_assets() {
            local attempt
            for attempt in 1 2 3 4 5 6 7; do
              if gh release upload "$TAG" \
                build/OmniCore-v0.4.0-debug.apk \
                build/OmniCore-v0.4.0-debug.sha256 \
                "$SOURCE" \
                --clobber; then
                return 0
              fi
              if (( attempt < 7 )); then backoff_sleep "$attempt"; fi
            done
            echo "ERROR: GitHub asset upload remained unavailable after retries." >&2
            return 1
          }

          verify_release() {
            local attempt
            for attempt in 1 2 3 4 5 6 7; do
              if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
                --jq '{tag_name,name,draft,prerelease,html_url,assets:[.assets[].name]}' ; then
                return 0
              fi
              if (( attempt < 7 )); then backoff_sleep "$attempt"; fi
            done
            echo "ERROR: Could not verify published release after retries." >&2
            return 1
          }

          ensure_release
          upload_assets
          verify_release
