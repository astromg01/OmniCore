name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Clone repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags origin main
          git checkout -B main origin/main

      - name: Validate 0.8 compatibility foundation
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionName = "0.8.0"' app/build.gradle.kts
          grep -q 'libretro_host_v7.cpp' app/src/main/cpp/CMakeLists.txt
          grep -q 'gl_presenter.cpp' app/src/main/cpp/CMakeLists.txt
          grep -q 'GLESv2' app/src/main/cpp/CMakeLists.txt
          test -f app/src/main/cpp/libretro_host_v7.cpp
          test -f app/src/main/cpp/gl_presenter.cpp
          test -f app/src/main/java/com/omnicore/emulator/update/UpdateManager.kt
          test -f app/src/main/java/com/omnicore/emulator/update/UpdateInstallReceiver.kt
          grep -q 'EGL-GLES presenter' app/src/main/cpp/native_bridge.cpp
          grep -q 'setWillNotDraw(true)' app/src/main/java/com/omnicore/emulator/emulation/EmulationActivity.kt
          grep -q 'pcsx_rearmed_rgb32_output=enabled' app/src/main/java/com/omnicore/emulator/settings/Ps1Settings.kt
          grep -q 'pcsx_rearmed_show_bios_bootlogo' app/src/main/java/com/omnicore/emulator/settings/Ps1Settings.kt
          grep -q 'ps1-disc-cache' app/src/main/java/com/omnicore/emulator/emulation/EmulationActivity.kt
          grep -q 'AspectMode.WIDE_16_9' app/src/main/java/com/omnicore/emulator/emulation/EmulationActivity.kt
          grep -q 'lastModifiedMillis' app/src/main/java/com/omnicore/emulator/storage/SafGameSource.kt
          ! grep -q 'libretro_host_v6.cpp' app/src/main/cpp/CMakeLists.txt

      - name: Verify Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/28.2.13676358"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          java -version
          gradle --version
          test -d "$ANDROID_SDK_ROOT/platforms/android-36"
          test -x "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign"
          test -x "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          test -x "$ANDROID_NDK_HOME/ndk-build"
          test -x "$ANDROID_SDK_ROOT/cmake/3.31.5/bin/cmake"

      - name: Prepare stable DEV signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/signing
          base64 -d config/omnicore-dev.keystore.b64 > build/signing/omnicore-dev.jks
          chmod 600 build/signing/omnicore-dev.jks
          echo "OMNICORE_DEV_KEYSTORE=$GITHUB_WORKSPACE/build/signing/omnicore-dev.jks" >> "$GITHUB_ENV"
          echo "OMNICORE_DEV_STORE_PASSWORD=omnicore-dev-2026" >> "$GITHUB_ENV"
          echo "OMNICORE_DEV_KEY_ALIAS=omnicore-dev" >> "$GITHUB_ENV"
          echo "OMNICORE_DEV_KEY_PASSWORD=omnicore-dev-2026" >> "$GITHUB_ENV"
          keytool -list -keystore build/signing/omnicore-dev.jks -storepass omnicore-dev-2026 -alias omnicore-dev

      - name: Fetch pinned PCSX-ReARMed source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/fetch_ps1_core.sh tools/build_ps1_core_android.sh
          ./tools/fetch_ps1_core.sh

      - name: Build PS1 core for Android ARM
        shell: bash
        run: |
          set -euo pipefail
          ./tools/build_ps1_core_android.sh

      - name: Archive corresponding PS1 core source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/source-artifacts
          tar --exclude=.git -czf build/source-artifacts/pcsx-rearmed-da2cb8e-source.tar.gz -C third_party pcsx_rearmed

      - name: Build OmniCore debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify stable DEV signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          EXPECTED="9490d1ad4666312d6dd9e5b2a20699583919ae80a5536882bcd3f9accc793547"
          "$APKSIGNER" verify --print-certs "$APK"
          ACTUAL="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL" = "$EXPECTED" || { echo "ERROR: unexpected DEV signing certificate: $ACTUAL" >&2; exit 1; }
          echo "Stable DEV signer verified: $ACTUAL"

      - name: Verify native 16 KB alignment
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          CHECK_DIR="build/apk-alignment-check"
          rm -rf "$CHECK_DIR"
          mkdir -p "$CHECK_DIR"
          unzip -q "$APK" -d "$CHECK_DIR"
          READELF="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          while IFS= read -r -d '' SO; do
            echo "Checking ELF alignment: $SO"
            while IFS= read -r LOAD_LINE; do
              ALIGN_HEX="$(awk '{print $NF}' <<< "$LOAD_LINE")"
              if [[ ! "$ALIGN_HEX" =~ ^0x[0-9A-Fa-f]+$ ]]; then
                echo "ERROR: Could not parse LOAD alignment: $LOAD_LINE" >&2
                exit 1
              fi
              if (( ALIGN_HEX < 0x4000 )); then
                echo "ERROR: LOAD segment below 16 KB alignment: $LOAD_LINE" >&2
                exit 1
              fi
            done < <("$READELF" -lW "$SO" | grep -E '^[[:space:]]*LOAD[[:space:]]')
          done < <(find "$CHECK_DIR/lib" -type f -name '*.so' -print0)
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -v -c -P 16 4 "$APK"

      - name: Publish development APK and source bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v0.8.0-dev"
          TITLE="OmniCore v0.8.0 Compatibility & UX"
          NOTES="Stability-first PS1 revision built on the working v0.7 EGL/GLES pipeline. CUE/BIN sessions now use a validated persistent cache keyed by source fingerprint so unchanged multi-track games do not need to copy their BIN tracks on every launch; the first preparation remains compatibility-safe and later launches can reuse it. The copy buffer is increased for faster first-time staging and users can clear the PS1 disc cache from Tuning. A configurable classic PlayStation BIOS boot/logo option is enabled by default for users with a valid real BIOS and can be disabled for maximum compatibility. Presentation modes now include original 4:3, 16:9 expansion and fullscreen; 16:9 is a frontend presentation mode, not a per-game geometry patch. Runtime v7, XRGB8888, no-draw SurfaceView composition, AAudio, saves, touch input, SmartPerf, CUE validation and the in-app updater remain intact. Uses the same stable DEV signing certificate as v0.6+ so this release can update in place. ROMs, BIOS, firmware and console keys are not included."
          APK="app/build/outputs/apk/debug/app-debug.apk"
          SOURCE="build/source-artifacts/pcsx-rearmed-da2cb8e-source.tar.gz"
          TARGET="$(git rev-parse HEAD)"

          cp "$APK" build/OmniCore-v0.8.0-debug.apk
          sha256sum build/OmniCore-v0.8.0-debug.apk > build/OmniCore-v0.8.0-debug.sha256

          backoff_sleep() {
            local attempt="$1"
            local delay=$((5 * (1 << (attempt - 1))))
            if (( delay > 40 )); then delay=40; fi
            echo "GitHub API unavailable; retrying in ${delay}s (attempt ${attempt}/7)..."
            sleep "$delay"
          }

          ensure_release() {
            local attempt
            for attempt in 1 2 3 4 5 6 7; do
              if gh release view "$TAG" >/dev/null 2>&1; then
                if gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --prerelease --target "$TARGET"; then return 0; fi
              else
                if gh release create "$TAG" --target "$TARGET" --title "$TITLE" --notes "$NOTES" --prerelease; then return 0; fi
                if gh release view "$TAG" >/dev/null 2>&1; then
                  if gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --prerelease --target "$TARGET"; then return 0; fi
                fi
              fi
              if (( attempt < 7 )); then backoff_sleep "$attempt"; fi
            done
            return 1
          }

          upload_assets() {
            local attempt
            for attempt in 1 2 3 4 5 6 7; do
              if gh release upload "$TAG" \
                build/OmniCore-v0.8.0-debug.apk \
                build/OmniCore-v0.8.0-debug.sha256 \
                "$SOURCE" --clobber; then return 0; fi
              if (( attempt < 7 )); then backoff_sleep "$attempt"; fi
            done
            return 1
          }

          ensure_release
          upload_assets
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            --jq '{tag_name,name,draft,prerelease,html_url,assets:[.assets[]|{name,size,digest}]}'
