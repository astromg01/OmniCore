name: Android Build

on:
  push:
    branches: [ "agent/0.10.0-n64-foundation" ]

permissions:
  contents: write

concurrency:
  group: android-n64-foundation
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Clone N64 foundation branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags origin agent/0.10.0-n64-foundation
          git checkout -B agent/0.10.0-n64-foundation origin/agent/0.10.0-n64-foundation

      - name: Validate N64 playable architecture
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionName = "0.10.0"' app/build.gradle.kts
          grep -q 'ConsoleSystem.NINTENDO_64 -> N64Core()' app/src/main/java/com/omnicore/emulator/core/CoreRegistry.kt
          grep -q 'omnicore_n64_runtime' app/src/main/cpp/CMakeLists.txt
          grep -q 'n64_libretro_host.cpp' app/src/main/cpp/CMakeLists.txt
          grep -q '\${aaudio-lib}' app/src/main/cpp/CMakeLists.txt
          grep -q 'N64EmulationActivity.intent' app/src/main/java/com/omnicore/emulator/core/n64/N64Core.kt
          grep -q 'N64RomPreparer.prepare' app/src/main/java/com/omnicore/emulator/emulation/N64EmulationActivity.kt
          grep -q 'N64GamepadOverlayView' app/src/main/java/com/omnicore/emulator/emulation/N64EmulationActivity.kt
          grep -q 'Pointer ownership' app/src/main/java/com/omnicore/emulator/emulation/N64GamepadOverlayView.kt
          grep -q 'N64SmartPerf.initial' app/src/main/java/com/omnicore/emulator/emulation/N64EmulationActivity.kt
          grep -q 'N64SmartPerf.adapt' app/src/main/java/com/omnicore/emulator/emulation/N64EmulationActivity.kt
          grep -q 'audioBufferBursts = decision.audioBufferBursts' app/src/main/java/com/omnicore/emulator/core/n64/N64NativeBridge.kt
          grep -q 'AAudioStreamBuilder_setPerformanceMode' app/src/main/cpp/n64/n64_libretro_host.cpp
          grep -q 'adaptAudio(config_.audioBufferBursts)' app/src/main/cpp/n64/n64_libretro_host.cpp
          grep -q 'N64 RUN OK' app/src/main/cpp/n64/n64_libretro_host.cpp
          grep -q 'RETRO_ENVIRONMENT_SET_HW_RENDER' app/src/main/cpp/n64/n64_libretro_host.cpp
          grep -q 'glBlitFramebuffer' app/src/main/cpp/n64/n64_libretro_host.cpp
          grep -q 'kTelemetryCapacity' app/src/main/cpp/n64/n64_libretro_host.h
          grep -q 'android:name=".emulation.N64EmulationActivity"' app/src/main/AndroidManifest.xml
          grep -q 'object N64SmartPerf' app/src/main/java/com/omnicore/emulator/performance/N64SmartPerf.kt
          grep -q 'N64InputSettings' app/src/main/java/com/omnicore/emulator/settings/N64InputSettings.kt
          grep -q 'Controle N64' app/src/main/java/com/omnicore/emulator/ui/n64/N64SettingsDialog.kt
          grep -q 'Configurar N64' app/src/main/java/com/omnicore/emulator/ui/OmniCoreV3App.kt
          grep -q 'PlayStation Tuning' app/src/main/java/com/omnicore/emulator/ui/OmniCoreV3App.kt
          git diff --check

      - name: Verify Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/28.2.13676358"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          java -version
          gradle --version
          test -x "$ANDROID_NDK_HOME/ndk-build"
          test -x "$ANDROID_SDK_ROOT/cmake/3.31.5/bin/cmake"

      - name: Fast compile N64 host and Kotlin
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:externalNativeBuildDebug :app:compileDebugKotlin --stacktrace --no-daemon

      - name: Build isolated PS1 core
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/fetch_ps1_core.sh tools/build_ps1_core_android.sh
          ./tools/fetch_ps1_core.sh
          ./tools/build_ps1_core_android.sh

      - name: Build isolated N64 core
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/fetch_n64_core.sh tools/build_n64_core_android.sh
          ./tools/fetch_n64_core.sh
          ./tools/build_n64_core_android.sh

      - name: Verify core coexistence
        shell: bash
        run: |
          set -euo pipefail
          for ABI in arm64-v8a armeabi-v7a; do
            test -f "app/src/main/jniLibs/$ABI/libpcsx_rearmed_libretro.so"
            test -f "app/src/main/jniLibs/$ABI/libmupen64plus_next_libretro.so"
          done

      - name: Build 0.10.0 N64 playable APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Record validation success
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .ci
          rm -f .ci/n64-foundation-failure.txt
          printf 'run_id=%s\ncommit=%s\nstatus=success\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > .ci/n64-foundation-success.txt
          git config user.name "Mauricio.dev"
          git config user.email "antoniomauriciorodriguesalves@gmail.com"
          git add .ci
          git commit -m "Record N64 playable validation success [skip ci]" || true
          git push origin HEAD:agent/0.10.0-n64-foundation || true

      - name: Record validation failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          [[ -d .git ]] || exit 0
          mkdir -p .ci
          rm -f .ci/n64-foundation-success.txt
          printf 'run_id=%s\ncommit=%s\nstatus=failure\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > .ci/n64-foundation-failure.txt
          git config user.name "Mauricio.dev"
          git config user.email "antoniomauriciorodriguesalves@gmail.com"
          git add .ci
          git commit -m "Record N64 playable validation failure [skip ci]" || true
          git push origin HEAD:agent/0.10.0-n64-foundation || true
