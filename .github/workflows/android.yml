name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Clone repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags origin main
          git checkout -B main origin/main

      - name: Validate 0.9.4 multitouch and smoothness foundation
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionName = "0.9.4"' app/build.gradle.kts
          grep -q 'libretro_host_v7.cpp' app/src/main/cpp/CMakeLists.txt
          grep -q 'gl_presenter.cpp' app/src/main/cpp/CMakeLists.txt
          grep -q 'EGL-GLES presenter' app/src/main/cpp/native_bridge.cpp
          test -f app/src/main/java/com/omnicore/emulator/cheats/CheatStore.kt
          test -f app/src/main/java/com/omnicore/emulator/settings/InputSettings.kt
          grep -q 'buttonPointerTargets' app/src/main/java/com/omnicore/emulator/emulation/GamepadOverlayView.kt
          grep -q 'syncPressedButtonsFromPointers' app/src/main/java/com/omnicore/emulator/emulation/GamepadOverlayView.kt
          grep -q 'SparseIntArray' app/src/main/java/com/omnicore/emulator/emulation/GamepadOverlayView.kt
          grep -q 'TAM −' app/src/main/java/com/omnicore/emulator/emulation/GamepadOverlayView.kt
          grep -q 'resolveControlScale' app/src/main/java/com/omnicore/emulator/settings/InputSettings.kt
          grep -q 'dpadProjectionCache' app/src/main/java/com/omnicore/emulator/emulation/GamepadOverlayView.kt
          grep -q 'fadeScheduledAtMs' app/src/main/java/com/omnicore/emulator/emulation/GamepadOverlayView.kt
          grep -q 'withContext(Dispatchers.IO)' app/src/main/java/com/omnicore/emulator/ui/OmniCoreV3App.kt
          grep -q 'retro_cheat_set' app/src/main/cpp/libretro_host_v7.cpp
          ! grep -q '3 dedos: menu' app/src/main/java/com/omnicore/emulator/emulation/GamepadOverlayView.kt
          ! grep -A3 'override fun onDraw' app/src/main/java/com/omnicore/emulator/emulation/GamepadOverlayView.kt | grep -q 'resolveForGame'
          ! grep -q 'libretro_host_v6.cpp' app/src/main/cpp/CMakeLists.txt

      - name: Verify Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/28.2.13676358"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          java -version
          gradle --version
          test -d "$ANDROID_SDK_ROOT/platforms/android-36"
          test -x "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign"
          test -x "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          test -x "$ANDROID_NDK_HOME/ndk-build"
          test -x "$ANDROID_SDK_ROOT/cmake/3.31.5/bin/cmake"

      - name: Prepare stable DEV signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/signing
          base64 -d config/omnicore-dev.keystore.b64 > build/signing/omnicore-dev.jks
          chmod 600 build/signing/omnicore-dev.jks
          echo "OMNICORE_DEV_KEYSTORE=$GITHUB_WORKSPACE/build/signing/omnicore-dev.jks" >> "$GITHUB_ENV"
          echo "OMNICORE_DEV_STORE_PASSWORD=omnicore-dev-2026" >> "$GITHUB_ENV"
          echo "OMNICORE_DEV_KEY_ALIAS=omnicore-dev" >> "$GITHUB_ENV"
          echo "OMNICORE_DEV_KEY_PASSWORD=omnicore-dev-2026" >> "$GITHUB_ENV"
          keytool -list -keystore build/signing/omnicore-dev.jks -storepass omnicore-dev-2026 -alias omnicore-dev

      - name: Fetch pinned PCSX-ReARMed source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/fetch_ps1_core.sh tools/build_ps1_core_android.sh
          ./tools/fetch_ps1_core.sh

      - name: Build PS1 core for Android ARM
        shell: bash
        run: |
          set -euo pipefail
          ./tools/build_ps1_core_android.sh

      - name: Archive corresponding PS1 core source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/source-artifacts
          tar --exclude=.git -czf build/source-artifacts/pcsx-rearmed-da2cb8e-source.tar.gz -C third_party pcsx_rearmed

      - name: Build OmniCore debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify stable DEV signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          EXPECTED="9490d1ad4666312d6dd9e5b2a20699583919ae80a5536882bcd3f9accc793547"
          "$APKSIGNER" verify --print-certs "$APK"
          ACTUAL="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL" = "$EXPECTED" || { echo "ERROR: unexpected DEV signing certificate: $ACTUAL" >&2; exit 1; }

      - name: Verify native 16 KB alignment
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          CHECK_DIR="build/apk-alignment-check"
          rm -rf "$CHECK_DIR"
          mkdir -p "$CHECK_DIR"
          unzip -q "$APK" -d "$CHECK_DIR"
          READELF="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          while IFS= read -r -d '' SO; do
            while IFS= read -r LOAD_LINE; do
              ALIGN_HEX="$(awk '{print $NF}' <<< "$LOAD_LINE")"
              [[ "$ALIGN_HEX" =~ ^0x[0-9A-Fa-f]+$ ]] || exit 1
              (( ALIGN_HEX >= 0x4000 )) || { echo "ERROR: LOAD segment below 16 KB alignment: $LOAD_LINE" >&2; exit 1; }
            done < <("$READELF" -lW "$SO" | grep -E '^[[:space:]]*LOAD[[:space:]]')
          done < <(find "$CHECK_DIR/lib" -type f -name '*.so' -print0)
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -v -c -P 16 4 "$APK"

      - name: Publish development APK and source bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v0.9.4-dev"
          TITLE="OmniCore v0.9.4 Multitouch & Smoothness"
          NOTES="Stability-focused update after real-device testing. Touch input now uses stable per-pointer ownership so holding an action button while moving the analog stick no longer causes the button command to jump or release from small finger movement. The accidental three-finger Quick Menu gesture has been removed; the compact on-screen ⋮ button remains the normal menu entry, while the intentional four-finger overlay toggle is retained. The control editor now lets each individual control, including the analog stick, be resized from 65% to 145% and saves the size per game alongside position and layout. Gameplay frontend work was reduced by removing SharedPreferences reads from onDraw, caching analog-to-D-pad projection states, coalescing idle-fade callbacks, avoiding per-frame visible-region allocations, reusing drawing geometry and applying stored cheats only once after the core starts. App startup also moves library parsing, BIOS discovery and PS1 core probing off the UI thread, while library persistence is dispatched away from Compose rendering. PCSX-ReARMed, Runtime v7, Clean Overlay, Cheat Manager, Smart Analog, save-state prefetch, CUE/BIN cache, AAudio and SmartPerf remain intact. Uses the same stable DEV signing certificate and updates in place. ROMs, BIOS, firmware, console keys and cheat databases are not included."
          APK="app/build/outputs/apk/debug/app-debug.apk"
          SOURCE="build/source-artifacts/pcsx-rearmed-da2cb8e-source.tar.gz"
          TARGET="$(git rev-parse HEAD)"
          OUT="build/OmniCore-v0.9.4-debug.apk"
          HASH="build/OmniCore-v0.9.4-debug.sha256"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > "$HASH"

          backoff_sleep() {
            local attempt="$1"
            local delay=$((5 * (1 << (attempt - 1))))
            (( delay <= 40 )) || delay=40
            sleep "$delay"
          }

          ensure_release() {
            local attempt
            for attempt in 1 2 3 4 5 6 7; do
              if gh release view "$TAG" >/dev/null 2>&1; then
                gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --prerelease --target "$TARGET" && return 0
              else
                gh release create "$TAG" --target "$TARGET" --title "$TITLE" --notes "$NOTES" --prerelease && return 0
              fi
              (( attempt == 7 )) || backoff_sleep "$attempt"
            done
            return 1
          }

          upload_assets() {
            local attempt
            for attempt in 1 2 3 4 5 6 7; do
              gh release upload "$TAG" "$OUT" "$HASH" "$SOURCE" --clobber && return 0
              (( attempt == 7 )) || backoff_sleep "$attempt"
            done
            return 1
          }

          ensure_release
          upload_assets
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '{tag_name,name,draft,prerelease,html_url,assets:[.assets[]|{name,size,digest}]}'
