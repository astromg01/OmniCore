name: PS2 Alpha 5 Runtime Compatibility

on:
  push:
    branches: [ "agent/0.11.0-ps2-foundation" ]
    paths:
      - ".ci/ps2-alpha5-trigger.txt"

permissions:
  contents: write
  statuses: write

concurrency:
  group: ps2-alpha5-runtime-compatibility
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PS2 branch
        uses: actions/checkout@v4
        with:
          ref: agent/0.11.0-ps2-foundation
          fetch-depth: 0

      - name: Publish pending status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state='pending' -f context='omnicore/ps2-alpha5' \
            -f description='PS2 Alpha 5 runtime compatibility validation running' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Protect PS1 and N64 runtimes
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin agent/0.10.0-n64-foundation
          changed="$(git diff --name-only origin/agent/0.10.0-n64-foundation...HEAD)"
          forbidden='^(app/src/main/cpp/(native_bridge\.cpp|gl_presenter\.cpp|libretro_host_v7\.cpp|n64/)|app/src/main/java/com/omnicore/emulator/core/n64/|app/src/main/java/com/omnicore/emulator/emulation/N64|app/src/main/java/com/omnicore/emulator/performance/N64)'
          if echo "$changed" | grep -E "$forbidden"; then
            echo "PS2 Alpha 5 modified protected PS1/N64 runtime source." >&2
            exit 1
          fi
          git diff --check origin/agent/0.10.0-n64-foundation...HEAD

      - name: Verify Alpha 5 source contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'versionCode = 44' app/build.gradle.kts
          grep -Fq 'versionName = "0.11.4"' app/build.gradle.kts
          grep -Fq 'PS2GameTuning.observe' app/src/main/java/com/omnicore/emulator/emulation/PS2EmulationActivity.kt
          grep -Fq 'setFrameRate' app/src/main/java/com/omnicore/emulator/emulation/PS2EmulationActivity.kt
          grep -Fq 'setSustainedPerformanceMode' app/src/main/java/com/omnicore/emulator/emulation/PS2EmulationActivity.kt
          grep -Fq 'SLOW_FPS = 24f' app/src/main/java/com/omnicore/emulator/performance/PS2GameTuning.kt
          grep -Fq 'REQUIRED_SLOW_SAMPLES = 5' app/src/main/java/com/omnicore/emulator/performance/PS2GameTuning.kt
          grep -Fq 'MIN_PLAUSIBLE_SIZE' app/src/main/java/com/omnicore/emulator/settings/PS2BiosManager.kt
          grep -Fq 'ActivityResultContracts.OpenDocument' app/src/main/java/com/omnicore/emulator/ui/ps2/PS2SettingsDialog.kt
          grep -Fq 'Play! atual usa HLE BIOS' app/src/main/java/com/omnicore/emulator/ui/ps2/PS2SettingsDialog.kt
          grep -Fq 'qualityFloorScale >= 1.0f' app/src/main/java/com/omnicore/emulator/core/ps2/PS2Backend.kt
          grep -Fq 'allowCycleSkipping = false' app/src/main/java/com/omnicore/emulator/performance/PS2SmartPerf.kt
          grep -Fq 'android:process=":ps2"' app/src/main/AndroidManifest.xml
          echo "OMNICORE_PS2_ALPHA5_SOURCE_OK measured-tuning bios-prep pacing quality-floor"

      - name: Verify Android toolchains
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          OMNI_NDK="$ANDROID_SDK_ROOT/ndk/28.2.13676358"
          PLAY_NDK="$ANDROID_SDK_ROOT/ndk/29.0.14206865"
          test -d "$OMNI_NDK"
          if ! test -d "$PLAY_NDK"; then
            yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865"
          fi
          echo "OMNI_NDK_HOME=$OMNI_NDK" >> "$GITHUB_ENV"
          echo "PLAY_NDK_HOME=$PLAY_NDK" >> "$GITHUB_ENV"

      - name: Prepare stable DEV signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/signing
          base64 -d config/omnicore-dev.keystore.b64 > build/signing/omnicore-dev.jks
          chmod 600 build/signing/omnicore-dev.jks
          echo "OMNICORE_DEV_KEYSTORE=$GITHUB_WORKSPACE/build/signing/omnicore-dev.jks" >> "$GITHUB_ENV"
          echo "OMNICORE_DEV_STORE_PASSWORD=omnicore-dev-2026" >> "$GITHUB_ENV"
          echo "OMNICORE_DEV_KEY_ALIAS=omnicore-dev" >> "$GITHUB_ENV"
          echo "OMNICORE_DEV_KEY_PASSWORD=omnicore-dev-2026" >> "$GITHUB_ENV"

      - name: Build protected PS1 and N64 cores
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$OMNI_NDK_HOME"
          chmod +x tools/fetch_ps1_core.sh tools/build_ps1_core_android.sh tools/fetch_n64_core.sh tools/build_n64_core_android.sh
          tools/fetch_ps1_core.sh
          tools/build_ps1_core_android.sh
          tools/fetch_n64_core.sh
          tools/build_n64_core_android.sh
          for ABI in arm64-v8a armeabi-v7a; do
            test -s "app/src/main/jniLibs/$ABI/libpcsx_rearmed_libretro.so"
            test -s "app/src/main/jniLibs/$ABI/libmupen64plus_next_libretro.so"
          done

      - name: Fetch pinned Play backend and compatibility DB
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/fetch_ps2_play_backend.sh tools/build_ps2_play_backend_android.sh
          tools/fetch_ps2_play_backend.sh
          test "$(git -C build/third_party/play rev-parse HEAD)" = "04bde0df87ee7c0e2f0151b51bb2cc22c88541da"
          test -s build/third_party/play/GameConfig.xml
          COUNT="$(grep -c '<GameConfig ' build/third_party/play/GameConfig.xml)"
          test "$COUNT" -eq 47
          grep -Fq '<IdleLoopBlock' build/third_party/play/GameConfig.xml

      - name: Build pinned Play dual ABI with full LTO
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$PLAY_NDK_HOME"
          export PLAY_ABIS="arm64-v8a armeabi-v7a"
          export PLAY_BUILD_JOBS="2"
          tools/build_ps2_play_backend_android.sh
          cmp -s build/third_party/play/GameConfig.xml app/src/main/assets/GameConfig.xml
          for ABI in arm64-v8a armeabi-v7a; do
            test -s "app/src/main/jniLibs/$ABI/libPlay.so"
          done

      - name: Verify Play telemetry JNI
        shell: bash
        run: |
          set -euo pipefail
          READELF="$PLAY_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          for ABI in arm64-v8a armeabi-v7a; do
            TABLE="$($READELF -Ws app/src/main/jniLibs/$ABI/libPlay.so)"
            grep -Fq 'Java_com_virtualapplications_play_StatsManager_getFrames' <<< "$TABLE"
            grep -Fq 'Java_com_virtualapplications_play_StatsManager_getDrawCalls' <<< "$TABLE"
            grep -Fq 'Java_com_virtualapplications_play_NativeInterop_bootDiskImage' <<< "$TABLE"
          done

      - name: Build signed Alpha 5 APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          APK_LISTING="$RUNNER_TEMP/alpha5-apk-listing.txt"
          unzip -l "$APK" > "$APK_LISTING"
          grep -Fq 'assets/GameConfig.xml' "$APK_LISTING"
          for ABI in arm64-v8a armeabi-v7a; do
            grep -Fq "lib/$ABI/libPlay.so" "$APK_LISTING"
            grep -Fq "lib/$ABI/libomnicore_ps2_runtime.so" "$APK_LISTING"
          done

      - name: Verify signer and 16 KB compatibility
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          EXPECTED="9490d1ad4666312d6dd9e5b2a20699583919ae80a5536882bcd3f9accc793547"
          CERT_INFO="$RUNNER_TEMP/alpha5-cert-info.txt"
          "$APKSIGNER" verify --print-certs "$APK" > "$CERT_INFO"
          ACTUAL="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$CERT_INFO" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL" = "$EXPECTED"
          CHECK_DIR="build/apk-alignment-check"
          rm -rf "$CHECK_DIR" && mkdir -p "$CHECK_DIR"
          unzip -q "$APK" -d "$CHECK_DIR"
          READELF="$OMNI_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          while IFS= read -r -d '' SO; do
            while IFS= read -r LOAD_LINE; do
              ALIGN_HEX="$(awk '{print $NF}' <<< "$LOAD_LINE")"
              [[ "$ALIGN_HEX" =~ ^0x[0-9A-Fa-f]+$ ]]
              (( ALIGN_HEX >= 0x4000 ))
            done < <("$READELF" -lW "$SO" | grep -E '^[[:space:]]*LOAD[[:space:]]')
          done < <(find "$CHECK_DIR/lib" -type f -name '*.so' -print0)
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -v -c -P 16 4 "$APK"

      - name: Archive GPL core sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/source-artifacts
          tar --exclude=.git -czf build/source-artifacts/pcsx-rearmed-da2cb8e-source.tar.gz -C third_party pcsx_rearmed
          tar --exclude=.git -czf build/source-artifacts/mupen64plus-next-f275caf-source.tar.gz -C third_party mupen64plus_next

      - name: Publish PS2 Alpha 5 prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v0.11.4-ps2-alpha5"
          TITLE="OmniCore v0.11.4 PS2 Alpha 5"
          NOTES="Fifth PS2 device-test alpha focused on the remaining strong slow-motion/stutter feedback. Keeps the Play! GameConfig compatibility database and full-LTO backend from Alpha 4, then starts using Play!'s real frame/draw-call counters for conservative per-game renderer tuning: sustained severe slowdown in AUTO can queue Vulkan/GLES fallback for the next boot without changing resolution or enabling cycle skipping. Adds Android Surface frame-rate pacing and sustained-performance mode where the OS/device supports them. Adds a user-owned PS2 BIOS picker/storage/validation layer in OmniCore settings; the current Play! backend still uses HLE BIOS and cannot execute an external BIOS, so authentic Sony BIOS startup is not faked or bundled. This BIOS reference is groundwork for a future BIOS-capable PS2 backend. PS1/N64 remain isolated. No games, Sony BIOS, firmware, startup media or proprietary console assets are included."
          APK="app/build/outputs/apk/debug/app-debug.apk"
          OUT="build/OmniCore-v0.11.4-ps2-alpha5-debug.apk"
          HASH="build/OmniCore-v0.11.4-ps2-alpha5-debug.sha256"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > "$HASH"
          TARGET="$(git rev-parse HEAD)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --prerelease --target "$TARGET"
          else
            gh release create "$TAG" --target "$TARGET" --title "$TITLE" --notes "$NOTES" --prerelease
          fi
          gh release upload "$TAG" "$OUT" "$HASH" build/source-artifacts/pcsx-rearmed-da2cb8e-source.tar.gz build/source-artifacts/mupen64plus-next-f275caf-source.tar.gz --clobber

      - name: Publish success status
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state='success' -f context='omnicore/ps2-alpha5' \
            -f description='PS2 Alpha 5 runtime compatibility validated' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Publish failure status
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state='failure' -f context='omnicore/ps2-alpha5' \
            -f description='PS2 Alpha 5 validation failed' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Record Alpha 5 success
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          RESULT=/tmp/ps2-alpha5-success.txt
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "commit=$GITHUB_SHA"
            echo "status=success"
            echo "version=0.11.4"
            echo "tag=v0.11.4-ps2-alpha5"
            echo "play_revision=04bde0df87ee7c0e2f0151b51bb2cc22c88541da"
            echo "abis=arm64-v8a,armeabi-v7a"
            echo "features=measured-game-tuning,surface-pacing,sustained-performance,bios-prep,gameconfig-db,full-lto,quality-floor"
          } > "$RESULT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin agent/0.11.0-ps2-foundation
          git reset --hard origin/agent/0.11.0-ps2-foundation
          cp "$RESULT" .ci/ps2-alpha5-success.txt
          rm -f .ci/ps2-alpha5-failure.txt
          git add .ci/ps2-alpha5-success.txt .ci/ps2-alpha5-failure.txt 2>/dev/null || true
          git commit -m "Record PS2 Alpha 5 validation success [skip ci]" || true
          git push origin HEAD:agent/0.11.0-ps2-foundation

      - name: Record Alpha 5 failure
        if: failure()
        shell: bash
        run: |
          set +e
          RESULT=/tmp/ps2-alpha5-failure.txt
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "commit=$GITHUB_SHA"
            echo "status=failure"
            echo "version=0.11.4"
            echo "phase=ps2-alpha5-runtime-compatibility"
          } > "$RESULT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin agent/0.11.0-ps2-foundation
          git reset --hard origin/agent/0.11.0-ps2-foundation
          cp "$RESULT" .ci/ps2-alpha5-failure.txt
          git add .ci/ps2-alpha5-failure.txt
          git commit -m "Record PS2 Alpha 5 validation failure [skip ci]" || true
          git push origin HEAD:agent/0.11.0-ps2-foundation || true