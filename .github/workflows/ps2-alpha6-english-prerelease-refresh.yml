name: PS2 Alpha 6 English prerelease refresh

on:
  push:
    branches: [ "agent/0.11.5-ps2-pcsx2-foundation" ]
    paths:
      - ".github/workflows/ps2-alpha6-english-prerelease-refresh.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PS2 Alpha 6 branch
        uses: actions/checkout@v4
        with:
          ref: agent/0.11.5-ps2-pcsx2-foundation
          fetch-depth: 0

      - name: Update prerelease and persist English notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          cat > /tmp/alpha6-release-notes.md <<'EOF'
          ## ⬇️ DOWNLOAD THIS FILE
          **`OmniCore-v0.11.5-ps2-alpha6.apk`**

          This is the only Alpha 6 APK. The other assets are checksums and corresponding source archives.

          ### Alpha 6 — PCSX2 Foundation
          - PCSX2 through the pinned ARMSX2 Android ARM64 foundation replaces the Play! runtime used by Alphas 1–5.
          - A real user-supplied PS2 BIOS is required. OmniCore does not bundle or download Sony firmware.
          - Direct Boot uses PCSX2 Fast Boot; Classic BIOS boot uses the real firmware path with Fast Boot disabled.
          - Automatic renderer selection is delegated to PCSX2.
          - SmartPerf is measurement-only: no automatic renderer, limiter or internal-resolution switching and no cycle skipping.
          - The 1.0× minimum quality floor is preserved; Alpha 6 does not disable fog or alpha effects to manufacture FPS.
          - The source-built PCSX2 GS path now exposes Visibility v1 telemetry for primitive culling, draw batches, fog workload and alpha workload.
          - BALANCED keeps the visual-safe lockstep path instead of re-enabling the flicker-prone pipelined path.
          - PS1 and N64 runtimes remain isolated and protected by CI.
          - PCSX2/ARMSX2 pin: `7f0ae7a6c689b5b36eccc61b7adb480f65c7a3a3`.

          ### Current device-test focus
          Use **Automatic + 1× + frame limiter enabled**. Test Direct Boot first, then Classic BIOS boot. In a repeatable heavy gameplay scene, enable the PS2 telemetry HUD and capture GS, CULL, FOG, ALPHA and synchronization readings before any active visibility culling is enabled.

          ### Latest CI validation
          GitHub Actions run `32401858158` completed successfully after the Android system-SONAME validation fix. The pipeline validated the pinned source-built PCSX2/ARMSX2 emucore, Visibility v1 JNI symbol, protected PS1/N64 cores, signed release APK, expected DEV signer, 16 KB compatibility and corresponding source archives.

          ### Source and license
          The PCSX2/ARMSX2 emucore is GPLv3-or-later according to upstream licensing. The license is included in the APK and the corresponding pinned source snapshot is attached to this prerelease.
          EOF

          gh release edit v0.11.5-ps2-alpha6 \
            --repo "$GITHUB_REPOSITORY" \
            --title 'OmniCore v0.11.5 PS2 Alpha 6 — PCSX2 Foundation' \
            --notes-file /tmp/alpha6-release-notes.md \
            --prerelease

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('.github/workflows/ps2-alpha6-pcsx2.yml')
          text = path.read_text(encoding='utf-8')
          replacement = """          cat > build/alpha6-release-notes.md <<'EOF'
          ## ⬇️ DOWNLOAD THIS FILE
          **`OmniCore-v0.11.5-ps2-alpha6.apk`**

          This is the only Alpha 6 APK. The other assets are checksums and corresponding source archives.

          ### Alpha 6 — PCSX2 Foundation
          - PCSX2 through the pinned ARMSX2 Android ARM64 foundation replaces the Play! runtime used by Alphas 1–5.
          - A real user-supplied PS2 BIOS is required. OmniCore does not bundle or download Sony firmware.
          - Direct Boot uses PCSX2 Fast Boot; Classic BIOS boot uses the real firmware path with Fast Boot disabled.
          - Automatic renderer selection is delegated to PCSX2.
          - SmartPerf is measurement-only: no automatic renderer, limiter or internal-resolution switching and no cycle skipping.
          - The 1.0× minimum quality floor is preserved; Alpha 6 does not disable fog or alpha effects to manufacture FPS.
          - The source-built PCSX2 GS path now exposes Visibility v1 telemetry for primitive culling, draw batches, fog workload and alpha workload.
          - BALANCED keeps the visual-safe lockstep path instead of re-enabling the flicker-prone pipelined path.
          - PS1 and N64 runtimes remain isolated and protected by CI.
          - PCSX2/ARMSX2 pin: `7f0ae7a6c689b5b36eccc61b7adb480f65c7a3a3`.

          ### Current device-test focus
          Use **Automatic + 1× + frame limiter enabled**. Test Direct Boot first, then Classic BIOS boot. In a repeatable heavy gameplay scene, enable the PS2 telemetry HUD and capture GS, CULL, FOG, ALPHA and synchronization readings before any active visibility culling is enabled.

          ### Latest CI validation
          GitHub Actions run `32401858158` completed successfully after the Android system-SONAME validation fix. The pipeline validated the pinned source-built PCSX2/ARMSX2 emucore, Visibility v1 JNI symbol, protected PS1/N64 cores, signed release APK, expected DEV signer, 16 KB compatibility and corresponding source archives.

          ### Source and license
          The PCSX2/ARMSX2 emucore is GPLv3-or-later according to upstream licensing. The license is included in the APK and the corresponding pinned source snapshot is attached to this prerelease.
          EOF"""
          pattern = re.compile(r"          cat > build/alpha6-release-notes\.md <<'EOF'\n.*?\n          EOF", re.S)
          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one Alpha 6 release-notes block, found {count}')
          path.write_text(updated, encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ps2-alpha6-pcsx2.yml
          git rm .github/workflows/ps2-alpha6-english-prerelease-refresh.yml
          git commit -m 'Keep PS2 Alpha 6 prerelease information in English [skip ci]'
          git push origin HEAD:agent/0.11.5-ps2-pcsx2-foundation
