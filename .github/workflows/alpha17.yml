name: N64 Alpha 17

on:
  push:
    branches: [ "agent/0.10.0-n64-foundation" ]
    paths:
      - ".ci/alpha17-trigger.txt"

permissions:
  contents: write

concurrency:
  group: android-n64-alpha17
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Clone N64 foundation branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags origin agent/0.10.0-n64-foundation
          git checkout -B agent/0.10.0-n64-foundation origin/agent/0.10.0-n64-foundation

      - name: Apply Alpha 17 StarUI achievements migration
        shell: bash
        run: |
          set -euo pipefail
          HOST="app/src/main/cpp/n64/n64_libretro_host.cpp"
          HOST_BEFORE="$(sha256sum "$HOST" | awk '{print $1}')"
          if grep -q 'versionName = "0.10.15"' app/build.gradle.kts; then
            python3 tools/agent_01016_alpha17.py
            echo "ALPHA17_MIGRATED=1" >> "$GITHUB_ENV"
          elif grep -q 'versionName = "0.10.16"' app/build.gradle.kts; then
            echo "ALPHA17_MIGRATED=0" >> "$GITHUB_ENV"
          else
            echo "Unsupported OmniCore source version for Alpha 17" >&2
            exit 1
          fi
          HOST_AFTER="$(sha256sum "$HOST" | awk '{print $1}')"
          test "$HOST_BEFORE" = "$HOST_AFTER"

      - name: Validate Alpha 17 architecture and isolation
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 32' app/build.gradle.kts
          grep -q 'versionName = "0.10.16"' app/build.gradle.kts
          grep -q 'PrecisionGovernor v2' app/src/main/java/com/omnicore/emulator/performance/N64SmartPerf.kt
          grep -q 'internalResolution = requested.internalResolution' app/src/main/java/com/omnicore/emulator/performance/N64SmartPerf.kt
          grep -q 'threadedRenderer = requested.threadedRenderer' app/src/main/java/com/omnicore/emulator/performance/N64SmartPerf.kt
          grep -q 'OmniStarfieldBackground' app/src/main/java/com/omnicore/emulator/ui/OmniCoreV4App.kt
          grep -q 'OmniHubScreen.ACHIEVEMENTS' app/src/main/java/com/omnicore/emulator/ui/OmniCoreV4App.kt
          grep -q 'AchievementsScreen' app/src/main/java/com/omnicore/emulator/ui/OmniCoreV4App.kt
          grep -q 'isLowRamDevice' app/src/main/java/com/omnicore/emulator/ui/theme/OmniStarfield.kt
          grep -q 'isPowerSaveMode' app/src/main/java/com/omnicore/emulator/ui/theme/OmniStarfield.kt
          grep -q 'delay(50L)' app/src/main/java/com/omnicore/emulator/ui/theme/OmniStarfield.kt
          grep -q 'channel.lock()' app/src/main/java/com/omnicore/emulator/achievements/OmniAchievements.kt
          grep -q 'ATOMIC_MOVE' app/src/main/java/com/omnicore/emulator/achievements/OmniAchievements.kt
          grep -q 'n64_active_seconds' app/src/main/java/com/omnicore/emulator/achievements/OmniAchievements.kt
          grep -q 'silky_session' app/src/main/java/com/omnicore/emulator/achievements/OmniAchievements.kt
          grep -q 'AchievementBanner' app/src/main/java/com/omnicore/emulator/emulation/N64EmulationActivity.kt
          grep -q 'nextPollMs' app/src/main/java/com/omnicore/emulator/emulation/N64EmulationActivity.kt
          grep -q 'else -> 750L' app/src/main/java/com/omnicore/emulator/emulation/N64EmulationActivity.kt
          grep -q 'trackAchievementTelemetry' app/src/main/java/com/omnicore/emulator/emulation/N64EmulationActivity.kt
          grep -q 'P-GOV2' app/src/main/java/com/omnicore/emulator/emulation/N64EmulationActivity.kt
          grep -q 'pressureDebt' app/src/main/cpp/n64/n64_libretro_host.cpp
          grep -q 'candidateStreak' app/src/main/cpp/n64/n64_libretro_host.cpp
          grep -q 'jitterEwma' app/src/main/cpp/n64/n64_libretro_host.cpp
          ! grep -q 'runSmartPrecompile' app/src/main/cpp/n64/n64_libretro_host.cpp
          ! grep -q 'glFinish();' app/src/main/cpp/n64/n64_libretro_host.cpp
          grep -q 'OmniCore N64 Runtime 0.10.16' app/src/main/cpp/n64/n64_native_bridge.cpp
          grep -q 'X15("1.5x", "1,5×", 15)' app/src/main/java/com/omnicore/emulator/settings/N64Settings.kt
          grep -q 'framebufferEmulation = true' app/src/main/java/com/omnicore/emulator/settings/N64Settings.kt
          grep -q 'PIN="f275caf4b2bfa1e6d1c51636746ea793f3d80320"' tools/fetch_n64_core.sh
          CHANGED="$(git status --porcelain | sed -E 's/^.. //')"
          if grep -Eiq '(^|/)(ps1|pcsx)' <<< "$CHANGED"; then
            echo "Alpha 17 attempted to modify PS1-owned source:" >&2
            grep -Ei '(^|/)(ps1|pcsx)' <<< "$CHANGED" >&2
            exit 1
          fi
          git diff --check

      - name: Verify Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/28.2.13676358"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          test -d "$ANDROID_SDK_ROOT/platforms/android-36"
          test -x "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          test -x "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign"
          test -x "$ANDROID_NDK_HOME/ndk-build"

      - name: Reuse stable DEV signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/signing
          base64 -d config/omnicore-dev.keystore.b64 > build/signing/omnicore-dev.jks
          chmod 600 build/signing/omnicore-dev.jks
          echo "OMNICORE_DEV_KEYSTORE=$GITHUB_WORKSPACE/build/signing/omnicore-dev.jks" >> "$GITHUB_ENV"
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          text = Path('.github/workflows/android.yml').read_text(encoding='utf-8')
          keys = ('OMNICORE_DEV_STORE_PASSWORD', 'OMNICORE_DEV_KEY_ALIAS', 'OMNICORE_DEV_KEY_PASSWORD')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as out:
              for key in keys:
                  match = re.search(r'echo "' + re.escape(key) + r'=([^\"]+)" >> "\$GITHUB_ENV"', text)
                  if not match:
                      raise SystemExit(f'missing existing DEV signing field: {key}')
                  out.write(f'{key}={match.group(1)}\n')
          PY

      - name: Compile Kotlin and native N64 runtime
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:externalNativeBuildDebug :app:compileDebugKotlin --stacktrace --no-daemon

      - name: Build isolated emulator cores
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/fetch_ps1_core.sh tools/build_ps1_core_android.sh tools/fetch_n64_core.sh tools/build_n64_core_android.sh
          ./tools/fetch_ps1_core.sh
          ./tools/build_ps1_core_android.sh
          ./tools/fetch_n64_core.sh
          ./tools/build_n64_core_android.sh
          for ABI in arm64-v8a armeabi-v7a; do
            test -f "app/src/main/jniLibs/$ABI/libpcsx_rearmed_libretro.so"
            test -f "app/src/main/jniLibs/$ABI/libmupen64plus_next_libretro.so"
          done

      - name: Archive corresponding core sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/source-artifacts
          tar --exclude=.git -czf build/source-artifacts/pcsx-rearmed-da2cb8e-source.tar.gz -C third_party pcsx_rearmed
          tar --exclude=.git -czf build/source-artifacts/mupen64plus-next-f275caf-source.tar.gz -C third_party mupen64plus_next

      - name: Build signed Alpha 17 APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify DEV signer and native 16 KB alignment
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          EXPECTED="9490d1ad4666312d6dd9e5b2a20699583919ae80a5536882bcd3f9accc793547"
          "$APKSIGNER" verify --print-certs "$APK"
          ACTUAL="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL" = "$EXPECTED"
          CHECK_DIR="build/apk-alignment-check"
          rm -rf "$CHECK_DIR" && mkdir -p "$CHECK_DIR"
          unzip -q "$APK" -d "$CHECK_DIR"
          READELF="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          while IFS= read -r -d '' SO; do
            while IFS= read -r LOAD_LINE; do
              ALIGN_HEX="$(awk '{print $NF}' <<< "$LOAD_LINE")"
              [[ "$ALIGN_HEX" =~ ^0x[0-9A-Fa-f]+$ ]]
              (( ALIGN_HEX >= 0x4000 ))
            done < <("$READELF" -lW "$SO" | grep -E '^[[:space:]]*LOAD[[:space:]]')
          done < <(find "$CHECK_DIR/lib" -type f -name '*.so' -print0)
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -v -c -P 16 4 "$APK"

      - name: Commit validated Alpha 17 source
        if: env.ALPHA17_MIGRATED == '1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -f tools/agent_01016_alpha17.py
          git config user.name "Mauricio.dev"
          git config user.email "antoniomauriciorodriguesalves@gmail.com"
          git add app
          git add -u tools/agent_01016_alpha17.py
          git diff --cached --check
          git commit -m "Apply OmniCore 0.10.16 N64 Alpha 17 StarUI and achievements [skip ci]"
          git push origin HEAD:agent/0.10.0-n64-foundation

      - name: Publish N64 Alpha 17 prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v0.10.16-n64-alpha17"
          TITLE="OmniCore v0.10.16 N64 Alpha 17"
          NOTES="Seventeenth Nintendo 64 device-test alpha and the first major polish pass after PrecisionGovernor v2 stabilized real-device gameplay. The native N64 governor/pacer host is intentionally unchanged. Alpha 17 adds Omni StarUI: a dark cosmic theme with lightweight code-drawn stars, capped around 20 fps in the hub and automatically reduced/static on low-RAM devices or Battery Saver. The home logo now follows the original boot-star language. A new offline Achievements destination adds ten initial achievements, rarity, progress and animated unlock banners. Achievement state is stored in a tiny file protected by a cross-process file lock so the main hub and isolated :n64 process can safely share progress without stale multiprocess SharedPreferences. N64 hooks cover first confirmed run, active play time, performance-panel use, control customization, save states, Smart Analog activation and sustained low-jitter PrecisionGovernor v2 stability. Achievement disk writes run off the emulation/UI threads. N64 status/telemetry polling now relaxes from boot cadence to 750 ms after stable RUN OK, reducing unnecessary JNI/UI work during gameplay while preserving the existing 2.2 s SmartPerf adaptation window. PrecisionGovernor v2, PassiveWarmCache, DirectPresenter/RenderBridge, protected 1.5x resolution, framebuffer compatibility, Game-aware Smart Analog/Kirby, Dynarec and AAudio remain intact. PS1 runtime source remains isolated and unchanged. ROMs, BIOS, firmware, keys and games are not included."
          APK="app/build/outputs/apk/debug/app-debug.apk"
          OUT="build/OmniCore-v0.10.16-n64-alpha17-debug.apk"
          HASH="build/OmniCore-v0.10.16-n64-alpha17-debug.sha256"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > "$HASH"
          TARGET="$(git rev-parse HEAD)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --prerelease --target "$TARGET"
          else
            gh release create "$TAG" --target "$TARGET" --title "$TITLE" --notes "$NOTES" --prerelease
          fi
          gh release upload "$TAG" "$OUT" "$HASH" build/source-artifacts/pcsx-rearmed-da2cb8e-source.tar.gz build/source-artifacts/mupen64plus-next-f275caf-source.tar.gz --clobber

      - name: Record Alpha 17 success
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .ci
          printf 'run_id=%s\ncommit=%s\nstatus=success\nversion=0.10.16\ntag=v0.10.16-n64-alpha17\n' "$GITHUB_RUN_ID" "$(git rev-parse HEAD)" > .ci/n64-foundation-success.txt
          rm -f .ci/n64-foundation-failure.txt
          git config user.name "Mauricio.dev"
          git config user.email "antoniomauriciorodriguesalves@gmail.com"
          git add .ci/n64-foundation-success.txt
          git add -u .ci/n64-foundation-failure.txt 2>/dev/null || true
          git commit -m "Record N64 Alpha 17 validation success [skip ci]" || true
          git push origin HEAD:agent/0.10.0-n64-foundation

      - name: Record Alpha 17 failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          git reset --hard HEAD
          mkdir -p .ci
          printf 'run_id=%s\ncommit=%s\nstatus=failure\nversion=0.10.16-alpha17\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > .ci/n64-foundation-failure.txt
          git config user.name "Mauricio.dev"
          git config user.email "antoniomauriciorodriguesalves@gmail.com"
          git add .ci/n64-foundation-failure.txt
          git commit -m "Record N64 Alpha 17 validation failure [skip ci]" || true
          git push origin HEAD:agent/0.10.0-n64-foundation || true

      - name: Complete job
        run: echo "Alpha 17 validation finished"
